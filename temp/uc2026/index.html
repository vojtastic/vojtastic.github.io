/* Anotace přednášek (z PDF na webu pořadatele): název → [soubor PDF, odstavce]
   Odstavec začínající „§“ = mezititulek, „^“ = poznámka / zdroj (menší písmo). */
const ANN_BASE = 'https://www.arcdata.cz/content/dam/distributor-restricted/arcdata-cz/akce/2026/konference/abstrakty/';
const ANN = {"Nový územní plán Prahy – využití GIS a AI":["a-foglar-praha.pdf",["Po 27 letech má Praha nový územní plán. Ředitel odboru územního rozvoje Ing. arch. Filip Foglar představí data, statistiky a technické podrobnosti k využití aplikace, kterou Magistrát hl. m. Prahy vyvinul, aby zvládnul řádně a podrobně vypořádat 13 600 připomínek za 3 měsíce místo 3 let, což bylo standardem před změnou přístupu úřadu v roce 2022. Nyní město sklidilo ovoce a může odprezentovat zajímavosti, zodpovědět často kladené dotazy a nechat nahlédnout „pod pokličku“ použitým postupům, technologiím a vychytávkám, jakožto příklad dobré praxe pro další města."]],"Portál územního plánování obcí Kraje Vysočina":["a-tejkal-vysocina.pdf",["Portál územního plánování obcí (PÚPO) Kraje Vysočina, spuštěný v roce 2021 jako jednotný informační portál o územním plánování, prošel v uplynulém roce významným technologickým upgradem. V rámci něj jsme migrovali responzivní mapový atlas do moderního prostředí ArcGIS Experience Builder (provozovaný na platformě ArcGIS Enterprise). Rozvoj portálu současně zahrnoval vytvoření nového datového skladu a převedení dat ZÚR, územních plánů a ÚAP do jednotného standardu. Cílem prezentace je představit také klíčové novinky portálu."]],"Digitální transformace plánování: co potřebuje velké město":["a-holler-ukrm-plzen.pdf",["Příspěvek se věnuje tomu, proč už dnes nestačí chápat plánování jako statický dokument ani GIS pouze jako nástroj pro tvorbu map. Vychází z proměny legislativního a datového rámce územního plánování, který přináší rekodifikace, standardizace dat, ÚAP, DMVS nebo nástroje strojově čitelné dokumentace.","Ukazuje však, že samotná digitalizace a standardizace ještě automaticky neznamenají skutečný posun v plánování města. Vedle změny nástrojů je proto potřeba dál promýšlet i změnu samotné logiky legislativy a datového prostředí tak, aby lépe odpovídaly reálnému fungování velkých měst.","Příspěvek současně otevírá otázku, proč si města musí budovat vlastní datovou a analytickou infrastrukturu a jak data převádět do rozhodování, regulace a dlouhodobého rozvoje."]],"Jednotná platforma GIS v Dopravním podniku hl. m. Prahy: zakázkové řešení nad ArcGIS Enterprise":["a-kamensky-dpp.pdf",["Dopravní podnik hl. m. Prahy je páteří Pražské integrované dopravy a spravuje prostorová data mimořádně heterogenního prostředí — napříč pěti druhy dopravy, rozsáhlou technickou infrastrukturou i podzemními dráhami. Tato data dlouho žila v samostatných ostrovech: různé CAD a GIS nástroje, různé formáty a datové modely, nekonzistence, duplicity a chybějící dohledatelnost změn. K tomu přistoupily nároky legislativy okolo digitální technické mapy.","Příspěvek představí zakázkovou platformu, kterou DPP tuto roztříštěnost nahrazuje — postavenou nad Esri ArcGIS Enterprise. Nastíníme vícevrstvou architekturu (datové jádro, platformní a integrační vrstvu), přístup k datovému modelu s vazbou na národní standardy a bezeztrátovou migraci geometrie i atributů. Ukážeme, jak je platforma rozdělena do aplikací navržených přesně na jednotlivé role — od pokročilého pořizování dat v ArcGIS Pro a vlastního editoru nad Experience Builder/Maps SDK, přes webovou editaci, až po nahlížení a agendové portály — a jak vše řízeně komunikuje s podnikovými systémy přes servisní sběrnici.","Jde o řešení svého druhu první v České republice, kombinující standardní platformu s vlastním vývojem. Rádi se na konferenci podělíme o zkušenosti z jeho budování — včetně několika momentů, které stojí za to zažít naživo."]],"Využití Esri technologie v rámci IS DTM ŘSD":["a-polakova-karesova-rsd.pdf",["Digitální technická mapa ŘSD (DTM ŘSD) představuje klíčový nástroj pro správu, aktualizaci a poskytování prostorových dat o dopravní a technické infrastruktuře spravované Ředitelstvím silnic a dálnic. Systém je součástí širšího ekosystému Digitální mapy veřejné správy (DMVS) a je propojen s informačními systémy krajských digitálních technických map, Správy železnic a ČÚZK. ŘSD v tomto prostředí vystupuje nejen jako vlastník infrastruktury, ale také jako správce vymezených území a významný poskytovatel prostorových dat.","Představíme Vám základní prvky architektury a technologického zázemí IS DTM ŘSD s důrazem na využití Esri technologie nejen pro analýzy a sdílení dat, publikaci mapových služeb, ale i tvorbu mapové komponenty nebo jako podporu procesů pro vyjádření k existencím sítí.","Představíme interní i externí geoportál IS DTM ŘSD (https://dtm.rsd.cz/) a jejich možnosti pro uživatele z řad ŘSD i veřejnosti. Zaměříme se na jeho uživatelské vlastnosti, intuitivní práci s mapovými podklady, vyhledávání a zobrazení prostorových informací, přístup k mapovým službám a podporu procesů, jako je podávání žádostí o vyjádření k existenci sítí nebo poskytování dat veřejnosti a odborné veřejnosti. Součástí budou také ukázky praktického využití geoportálu při každodenní práci geodetů, správců infrastruktury a dalších uživatelů."]],"GIS v Pražské plynárenské: od modernizace technologií k nové roli v podnikové architektuře":["a-vydlakova-pr-plyn.pdf",["Pražská plynárenská Distribuce prošla v posledním období zásadní modernizací svého GIS prostředí. Přechod na moderní platformu ESRI postavenou na konceptu Utility Network a využití ArcGIS Pro neznamenal pouze technologickou výměnu jednotlivých komponent, ale především změnu způsobu, jakým jsou prostorová data spravována, sdílena a využívána napříč organizací. Přednáška nabídne pohled na tuto transformaci ze tří různých perspektiv. Z pohledu businessu a technické dokumentace představíme praktické zkušenosti uživatelů s novým GIS, nové možnosti práce s daty distribuční sítě a přínosy moderních GIS technologií pro každodenní provoz, správu dokumentace a rozhodování.","Technologická část se zaměří na architekturu nového řešení a klíčové změny, které modernizaci doprovázely. Vedle přechodu na Utility Network a ArcGIS Pro došlo k modernizaci klientské vrstvy GIS, změně databázové platformy na PostgreSQL a zásadní změně integračního přístupu. Původní vazby založené na přímém přístupu k databázi a využívání databázových pohledů byly nahrazeny transakční integrací přes standardizovaná aplikační rozhraní.","Třetí pohled zasadí GIS do širší architektury informačních systémů skupiny Pražská plynárenská a.s. GIS zde není pouze specializovanou aplikací pro práci s mapou, ale představuje centrální zdroj a integrační bod pro prostorová a technická data. Úzce spolupracuje zejména se systémy podporujícími provoz distribuční sítě, výstavbu a další procesy využívajícími informace o síťové infrastruktuře.","Cílem přednášky je ukázat, že modernizace GIS není pouze technologickým projektem, ale také postupnou proměnou jeho role v organizaci – od samostatného odborného systému směrem ke klíčovému prvku podnikové IT architektury a centrálnímu zdroji prostorových a technických dat pro navazující procesy a systémy."]],"Vodárenská síť jako živý systém":["a-hamouz-zmitko-unicorn-vak.pdf",["Jak navrhnout nový GIS tak, aby nebyl jen náhradou starého systému, ale skutečně změnil způsob práce celé organizace?","Na příkladu Vodovodů a kanalizací Pardubice ukážeme cestu od původního GeoStore V6 k moderní platformě Esri postavené na ArcGIS Enterprise a Utility Network. Projekt zahrnoval migraci a konsolidaci rozsáhlých prostorových dat, návrh nového datového modelu, zavedení Utility Network, integraci na okolní podnikové systémy i vytvoření webových a mobilních aplikací pro každodenní práci.","Důležitým cílem nebylo pouze převést data do nového prostředí, ale vytvořit z GISu jednotný zdroj informací pro techniky, dispečink, správu majetku i pracovníky v terénu. Nové řešení proto propojuje evidenci vodovodní a kanalizační infrastruktury s provozními procesy, umožňuje analýzu vazeb v síti, podporuje práci s odstávkami a dopady na odběrná místa a zpřístupňuje aktuální data přímo pracovníkům v terénu.","Součástí projektu jsou také integrace na další systémy VAK Pardubice, včetně technického informačního systému a provozních dat ze SCADA, a rozvoj webového dispečinku pro práci s poruchami a provozními událostmi.","Ukážeme, co při takové transformaci fungovalo, kde byly největší výzvy a proč je při modernizaci GIS důležité řešit nejen technologii, ale také datový model, integrace, procesy a role jednotlivých uživatelů.","Projekt zároveň představuje první implementaci ArcGIS Utility Network pro vodárenskou společnost v České republice.","Nečekejte produktovou prezentaci. Ukážeme konkrétní zkušenosti z reálného projektu – co bylo potřeba změnit v datech, procesech i způsobu práce a kde nový GIS přinesl největší přínos."]],"DataCollector – Od sběru dat po dokumentaci stavby":["a-nerad-cetin.pdf",["V rámci prezentace vám představíme využití mobilního řešení DataCollector a produktů platformy Esri při výstavbě sítě společnosti CETIN a.s. Ukážeme si, jak propojení mobilního sběru a GIS zefektivňuje předávání informací mezi staveništěm a kanceláří, minimalizuje chybovost a zajišťuje jednotný standard dat. Zaměříme se na praktické využití napříč všemi fázemi realizace projektu – od prvotního sběru terénních dat přes evidenci rozvodů až po finální dokumentaci stavby. Současně nastíníme směr budoucího vývoje a možnosti využití AI."]],"Řešení monitoringu suchovodů a nadzemních hydrantů na platformě ArcGIS v ORLENU":["a-rozsypal-orlen.pdf",["Tento příspěvek představí konkrétní využití platformy ArcGIS pro řešení monitoringu suchovodů a nadzemních hydrantů pro Hasičský záchranný sbor ve společnosti ORLEN UNIPETROL RPA, s.r.o.","Ukážeme, jak lze digitalizovat a zefektivnit proces revizí zařízení a realizace nápravných opatření s využitím mobilních aplikací pro sběr údajů v kombinaci s webovými řešitelskými aplikacemi a dashboardy pro jejich vyhodnocení a manažerský přehled.","Příspěvek se zaměří na praktické přínosy řešení, kdy díky elektronickému protokolování a automatickým notifikacím bude zajištěna rychlá reakce na poškození a efektivní správa infrastruktury při dodržení všech platných právních požadavků."]],"ArcGIS StoryMaps: Víc než jen příběh":["arcdata/a-ws-patkova.pdf",["ArcGIS StoryMaps už dávno nejsou jen jedna dlouhá webová stránka s příběhem a mapou. Dnes nabízí několik různých způsobů, jak prezentovat své mapy, data a další obsah. Kromě klasických interaktivních příběhů se zaměříme především na novinky a zajímavé funkce, jako jsou Briefings, Frames a Collections. Představíme si nové možnosti vizualizace dat pomocí grafů a infografik, ukážeme si propojení s dalšími ArcGIS aplikacemi, práci s AI a nové možnosti tvorby StoryMaps. Vše doplníme ukázkami a tipy, jak tyto možnosti využít při prezentaci dat."]],"From Reality Mapping to Digital Twins":["arcdata/a-ws-arkadiusz-esri.pdf",["GIS & Geospatial professionals have now access to enormous volumes of spatial data every day. From satellites, drones, sensors, BIM, and operational GIS. Yet many planning and operational decisions are still made using fragmented datasets and incomplete visibility.","This session explores how Reality Mapping and Digital Twin approaches help nations, cities and infrastructure organizations create a shared understanding of the built environment. By integrating foundational high-resolution Imagery, 3D reality layers with BIM data, and GIS layers within a spatial platform, organizations can move from static maps and isolated models toward living digital environments that support better planning, maintenance, and investment decisions.","Using real examples and practical workflows, the presentation will demonstrate how ArcGIS Platform enables organizations to transform raw pixels into decision-ready insights, providing realistic context, change detection, asset awareness, and simulation capabilities that support Urban, Environmental & infrastructure management throughout its lifecycle."]],"Památky v mapách: Jak NPÚ zpřístupňuje kulturní dědictví pomocí GIS":["a-sklenar-portes-npu-vars.pdf",["V letech 2025 a 2026 prošel Geoportál památkové péče Národního památkového ústavu zásadní technologickou modernizací, která vyvrcholila spuštěním nového řešení do ostrého provozu v červenci 2026. Projekt zahrnoval kompletní upgrade celé platformy, migraci dat, mapových služeb, webových aplikací i integračních služeb navázaných na Památkový katalog a další systémy. Součástí modernizovaného Geoportálu je i nový výdejní modul a modul pro správu a integraci účelových územních prvků s ČÚZK.","Přednáška se zaměří na zkušenosti z realizace rozsáhlé migrace prostředí Geoportálu, od návrhu cílové architektury přes migraci dat, mapových služeb a aplikací až po řešení specifických požadavků památkové péče. Představeny budou i zkušenosti se synchronizací a autentizací uživatelů nebo s přechodem z Web AppBuilderu na Experience Builder a vývojem vlastních widgetů, které nebylo možné nahradit standardní funkcionalitou platformy Esri. Součástí prezentace budou také zkušenosti s přípravou a realizací přechodu do produkčního prostředí, včetně ověřování funkčnosti, výkonu a návazností na okolní systémy.","Geoportál bude představen z pohledu jeho využití spolu s technologickými aspekty. Ukážeme, jak s dostupnými daty a mapovými aplikacemi může pracovat široká veřejnost, jaké informace může na Geoportálu zjistit a jak efektivně využívat jeho aplikace. Zároveň představíme funkcionality určené odborné veřejnosti a správcům GIS, včetně přístupu k pokročilejším nástrojům, mapovým službám a novému výdejnímu modulu, prostřednictvím kterého lze žádat o poskytování vybraných datových sad.","Součástí projektu bylo také vytvoření komplexního administrátorského zázemí, které umožňuje pracovníkům NPÚ samostatně spravovat obsah Geoportálu, publikovat služby, vytvářet nové aplikace a tematické weby, spravovat uživatelské role a rozvíjet systém vlastními silami."]],"Jedna platforma, mnoho agend: GIS řešení pro město Plzeň v ArcGIS Enterprise":["a-beranek-plzen.pdf",["Jak z množství různorodých GIS dat, aplikací a agend vytvořit prostředí, ve kterém se uživatel snadno zorientuje a rychle najde vše, co potřebuje? Na příkladu města Plzně představíme naše zkušenosti s postupným propojováním pasportů a dalších městských agend v prostředí ArcGIS Enterprise. Ukážeme cestu od samostatných tematických řešení k jednotnému geoportálu, který propojuje data, mapové aplikace i různé skupiny uživatelů. Výsledkem je přehledné a snadno dostupné prostředí, které sjednocuje práci s geografickými informacemi a usnadňuje jejich využití napříč městskou organizací."]],"Skryté mapy úřadu: Data, která pomáhají řídit kraj":["a-harbula-olomouc.pdf",["Přes dva roky je v provozu Datový portál Olomouckého kraje, který se zaměřuje na otevírání a zpřístupňování dat z prostředí krajského úřadu a Olomouckého kraje. Úroveň publikovaných datových sad je přitom přímo závislá na stavu zdrojových evidencí. Jedním z dalších cílů týmu datového portálu je proto zajistit vyšší kvalitu zdrojových dat ve spolupráci se zaměstnanci, kteří je vytvářejí, a kteří s nimi v prostředí úřadu pracují. Důležitou motivací jsou přitom konkrétní specifické datové výstupy ve formě interaktivních reportů nebo mapových vizualizací, které těmto zaměstnancům usnadňují každodenní práci. Příspěvek nabídne pohled za dveře kanceláří a představí vybrané (nejen) interní mapy a mapové aplikace, které podporují rozhodování, správu agend a řízení Olomouckého kraje."]],"Drony usnadňují práci!?!":["a-drozdek-opava.pdf",["Dron lze dnes pořídit stejně snadno jako výkonný fotoaparát. Tím ale podobnost končí. Jakmile jej město začne používat pro mapování, kontrolu staveb nebo dokumentaci mimořádné události, stává se provozovatelem letadla. Musí vybrat vhodný stroj, vyškolit piloty, nastavit odpovědnosti, pojištění, údržbu, evidenci i práci s obrazovými daty. Naše zkušenost ukazuje, že samotné létání je až posledním článkem podstatně delšího řetězce. Když na něj naváže zpracování dat a publikace těchto dat v geografickém informačním systému, promění se fotografie ve velmi cenný informační produkt. Výše uvedené povinnosti však nemají od nákupu dronu případné zájemce odrazovat. Právě naopak, dobře připravený provoz dronů v rámci organizace dává městu bezpečný a pružný nástroj, který může šetřit čas, náklady i práci v rizikovém terénu.","V přednášce se dozvíte zkušenosti z města Opavy. Představíme vám, proč jsme zvolili kombinaci profesionálního měřického dronu a lehkého dronu. Detailně rozebereme, jak jsme v praxi zvládli legislativní požadavky, výcvik pilotů, pojištění i nastavení interní směrnice a provozní koncepce. Ukážeme si náš postup předletové přípravy a na reálných příkladech předvedeme pestrou škálu využití – od krizového řízení a tvorby podrobných ortofotomap přes inspekce těžko přístupných památek a měření objemů skládek až po monitoring lokálních topenišť. Vysvětlíme také, proč je kriticky důležitá navazující IT infrastruktura, fotogrammetrické zpracování v ArcGIS Drone2Map a publikace výstupů v městském GIS, a dokážeme vám, že po překonání počáteční administrativní náročnosti se z dronů stává bezpečný, rutinní a nepostradatelný nástroj pro každodenní správu území."]],"Automatizace nasazování a konfigurace ArcGIS":["a-prochazka-cetin.pdf",["V návaznosti na loňskou prezentaci, která představila tým, metodiku a hlavní výzvy vývoje GIS řešení v CETIN, se letos zaměříme na jednu z nich: jak dostat novou verzi ke koncovým uživatelům rychle, spolehlivě a bez výpadku. Ukážeme, co přineslo nahrazení ručních kroků automatizací — kratší cestu od zadání k nasazení, méně chyb z nepozornosti a jasný přehled o tom, co v kterém prostředí právě běží. Součástí je ukázka administračního portálu, který tento přehled poskytuje a odkud se nové verze pouštějí do provozu."]],"Využití GIS pro koordinaci investičních záměrů ČEPS v územním plánování":["a-mazura-chrast-ceps.pdf",["Příspěvek představuje využití GIS v agendě územního plánování ve společnosti ČEPS, která je výhradním provozovatelem elektroenergetické přenosové soustavy ČR. Zájmy ČEPS pokrývají všechny stupně územního plánování od celostátních nástrojů, přes všechny krajské dokumentace, až po obecní územní plány v rozsahu přibližně 1600 dotčených obcí.","GIS je využíván pro centrální správu dat rozvojových záměrů a zároveň jako klíčový nástroj pro efektivní koordinaci investičních záměrů společnosti s územními podmínkami. Data jsou interním uživatelům zpřístupněna prostřednictvím mapové aplikace, jejíž součástí jsou georeferencované výkresy územně plánovací dokumentace doplněné o vyhodnocení souladu s investičními záměry ČEPS.","Na závěr budou představeny vize rozvoje GIS v oblasti územního plánování s pomocí umělé inteligence pro automatizovanou identifikaci kolizních míst v územně plánovací dokumentaci z pohledu rozvojových záměrů ČEPS a propojení výkresové a textové části územních plánů."]],"CS RequestPortal a ArcGIS – vyjadřovací činnost jednoduše, rychle a intuitivně":["a-kroupa-lazar-controlis.pdf",["CS RequestPortal digitalizuje a automatizuje vyjadřovací agendu vlastníků a správců technické infrastruktury – od podání žádosti až po vydání finálního vyjádření. Řešení mj. staví na nástrojích technologie ArcGIS od společnosti Esri: geoprocessingové služby ArcGIS zajišťují prostorové analýzy a vyhodnocení střetů se sítěmi, webová mapa ArcGIS poskytuje žadatelům i zpracovatelům plný mapový kontext v celém procesu správy žádosti o vyjádření. V rámci prezentace vás provedeme celým průběhem zpracování žádosti, AI vytěžováním projektových dokumentací a podělíme se o zkušenosti z prvních implementací u zákazníků."]],"Našeptávač místních názvů pomocí ArcGIS lokátorů":["a-ondrich-cendis.pdf",["Vyhledávání adres, ulic, sídel a krajů představuje jednu ze základních funkcí každé moderní mapové aplikace. Autoritativní data územního členění v Česku jsou dobře dostupná z veřejného registru RÚIAN, kde se pravidelně aktualizují, ale zveřejňují se ve fragmentární podobě, která není vhodná k přímému využití nástroji pro geokódování v prostředí ArcGIS Enterprise.","Příspěvek představí praktický postup, jak zdrojová data transformovat do podoby využitelné pro přípravu lokátoru v ArcGIS Pro, včetně triků a tipů, na co si dát pozor. Ve druhé části ukážeme, proč jsme využili kombinaci více různě nakonfigurovaných lokátorů namísto jediného multi-role lokátoru a co je třeba doprogramovat v samotné aplikaci, aby vyhledávací pole fungovalo jako skutečně inteligentní našeptávač."]],"GIS modelování větrné eroze v České republice: od půdních dat k rozhodovací podpoře ochrany krajiny":["a-kucera-blecha-vumo-pudy-spu.pdf",["Větrná eroze představuje významný degradační proces, který ovlivňuje kvalitu zemědělské půdy, stabilitu krajiny i produkční schopnost půd. Příspěvek představuje první celostátní mapu potenciální ztráty půdy větrnou erozí v České republice vyjádřenou v jednotkách t·ha⁻¹·rok⁻¹. Na rozdíl od vodní eroze dosud v České republice chybělo plošné hodnocení ztráty půdy způsobené větrem v těchto jednotkách. Nový přístup je založen na aplikaci rovnice WEQ (Wind Erosion Equation) v prostředí GIS a na vytvoření souboru národních mapových podkladů umožňujících kvantifikaci potenciální ztráty půdy větrnou erozí pro celé území České republiky.","Jedním z klíčových vstupů bylo vytvoření nové mapy půdního faktoru erodibility. Zde byla využita databáze BPEJ jako podklad pro návrh reprezentativní sítě odběrných lokalit, na nichž bylo v letech 2021 až 2024 odebráno přibližně 850 půdních vzorků pokrývajících hlavní půdní jednotky zemědělské půdy České republiky. Následně byly provedeny laboratorní analýzy erodovatelné a neerodovatelné frakce půdy, zrnitostního složení, obsahu organické hmoty a uhličitanů. Výsledky byly statisticky vyhodnoceny a využity pro vytvoření nové celostátní vrstvy faktoru erodibility určené pro modelování větrné eroze. Další vstupy představovaly klimatické charakteristiky odvozené z dat ČHMÚ, vrstva převládajících směrů větru a analýza délky nechráněných pozemků ve směru erozně nebezpečných větrů. Jednotlivé faktory byly integrovány v prostředí ArcGIS a využity pro tvorbu národních mapových podkladů potřebných pro výpočet potenciální ztráty půdy větrnou erozí.","Výsledky umožňují identifikovat nejvíce ohrožené oblasti, porovnávat míru erozního rizika mezi regiony a poskytují podklad pro návrh ochranných opatření, zejména větrolamů a dalších krajinotvorných prvků. Současně vytvářejí základ pro hodnocení účinnosti navrhovaných opatření a pro odbornou diskuzi nad limity přípustné ztráty půdy v podmínkách České republiky.","Přednáška ukáže, jak lze pomocí GIS propojit výsledky terénního průzkumu, laboratorních analýz a prostorových dat do podoby praktického využití pro podporu ochrany zemědělské půdy a adaptaci krajiny na změnu klimatu."]],"ČGS v Etiopii: od geologického mapování k moderní geovědní infrastruktuře":["a-verner-cgs.pdf",["Česká geologická služba (ČGS) již více než deset let realizuje v Etiopii významné rozvojové projekty zaměřené na základní i aplikovaný geologický a hydrogeologický výzkum, systematické geologické a hydrogeologické mapování území, hodnocení přírodních zdrojů a transfer odborného know-how. Základním principem těchto aktivit je systematické poznávání geologického prostředí a následný převod získaných poznatků do prakticky využitelných mapových, digitálních a interpretačních výstupů. Během tohoto období vzniklo více než 150 mapových děl nejrůznějších měřítek, od plánů péče o krajinu 1 : 20 000 přes geologické, hydrogeologické, půdní a geohazardní mapy 1 : 50 000 a 1 : 100 000 až po Národní geologickou a hydrogeologickou mapu Etiopie 1 : 1 200 000 (cgs.gov.cz/ethiopia). Právě mapování, komplexní výzkum horninového a hydrogeologického a vzdělávání expertů představuje jeden z hlavních pilířů dlouhodobé česko-etiopské spolupráce. V posledních letech vznikla řada regionálních geologických a hydrogeologických map různých měřítek, které postupně vytvářejí jednotnou geovědní databázi Etiopie.","§Národní geologická a hydrogeologická mapa Etiopie 1 : 1 200 000","Zcela zásadním výstupem současné spolupráce je nová národní geologická a hydrogeologická mapa Etiopie v měřítku 1 : 1 200 000, která představuje komplexní aktualizaci a syntézu současných poznatků o geologické a hydrogeologické stavbě celé země. Mapa vznikla na základě rozsáhlé kompilace nových i archivních geologických a hydrogeologických dat, jejich jednotné interpretace a nové koncepce regionálně-geologického a hydrogeologického členění Etiopie.","Význam mapy nespočívá pouze v aktualizaci geologického a hydrogeologického obrazu země, ale především ve vytvoření jednotného celostátního geovědního referenčního rámce, který umožňuje vzájemné propojení a interpretaci regionálních geovědních poznatků. Mapa tak vytváří základ pro další geologické a hydrogeologické mapování, hodnocení nerostného a vodního potenciálu, výzkum geologické stavby, hodnocení geologických rizik, infrastrukturní a územní plánování i odborné vzdělávání.","Mimořádnou kvalitu a mezinárodní význam tohoto výstupu potvrzuje skutečnost, že národní geologická mapa Etiopie v měřítku 1 : 1 200 000 získala v roce 2026 ocenění Mapa roku v České republice a cenu ESRI v San Diegu (SAG – Special Achievement in GIS). Toto ocenění představuje významné mezinárodní uznání nejen kvality zpracování digitální kartografie, ale také dlouhodobé odborné spolupráce českých a etiopských geologů.","Hydrogeologická mapa současně poskytuje jednotnou syntézu hydrogeologických poměrů celé země. Propojení geologické a hydrogeologické mapy umožňuje komplexně hodnotit vztahy mezi geologickou stavbou, charakterem horninového prostředí, typem a rozsahem zvodnění a potenciálem podzemních vod. Tyto výstupy mají přímý význam pro vyhledávání a ochranu vodních zdrojů, plánování vodohospodářské infrastruktury, zásobování obyvatelstva a zemědělství i pro strategické rozhodování veřejné správy.","§Od klasických map k digitální geovědní infrastruktuře","Z mapových dat uložených v databázích postupně vzniká integrovaná geovědní infrastruktura Etiopie, která umožňuje jednotlivá data dále doplňovat, aktualizovat, vzájemně kombinovat a prakticky využívat. Propojení regionálních geologických map v měřítku 1 : 100 000 s národní geologickou mapou v měřítku 1 : 1 000 000 v rámci mapových aplikací umožňuje efektivní využití geologických informací na různých prostorových úrovních. Data tak mohou sloužit zejména k plánování a cílení terénních průzkumů, hodnocení nerostného potenciálu, hydrogeologickým pracím, posuzování geologických rizik a podpoře územního a infrastrukturního plánování.","§Vzdělávání a transfer českého know-how","Nedílnou součástí projektů je úzká spolupráce s etiopskými institucemi a systematický rozvoj odborných kapacit. ČGS spolupracuje zejména s Ministry of Water and Energy (MoWE), Arba Minch University (AMU) a dalšími univerzitními a regionálními institucemi. V rámci spolupráce jsou realizovány odborné kurzy, workshopy, společné terénní práce a praktická školení zaměřená na geologické a hydrogeologické mapování, zpracování geovědních dat a využívání moderních metod jejich interpretace.","Významným výsledkem dlouhodobé spolupráce je také zapojení etiopských studentů do společného výzkumu a jejich odborný růst. V rámci spolupráce již několik studentů úspěšně dokončilo magisterské a doktorské studium geovědních oborů na Přírodovědecké fakultě Univerzity Karlovy. Transfer znalostí a dlouhodobé budování odborných kapacit tak vytvářejí předpoklady pro efektivní využívání, aktualizaci a další rozvoj vytvořené geovědní infrastruktury přímo etiopskými institucemi.","§Perspektivy další spolupráce","Na současné mapovací aktivity navazuje rozvoj 3D geologických a hydrogeologických modelů, kvantitativní hodnocení zdrojů podzemních vod a využití moderních geostatistických metod a nástrojů umělé inteligence. Modely hloubky a vydatnosti podzemních vod v několika krajích na jihu Etiopie využívají strojové učení k překlenutí nedostatku spolehlivých vstupních dat. Tyto aktivity probíhají v úzké spolupráci s George Mason University ve Virginii, USA, a nevládní organizací Global Map Aid ve Spojeném království. Cílem je propojit podrobné geologické a hydrogeologické mapování s digitálními modely a analytickými nástroji a vytvořit prakticky využitelné nástroje pro efektivní a udržitelné hospodaření s přírodními zdroji.","^Financování: Tato práce byla podpořena Českou rozvojovou agenturou (ČRA) v rámci projektů české rozvojové spolupráce v Etiopii."]],"Vymezení urbanizovaných území v prostředí GIS a hodnocení jejich ohroženosti pluviálními povodněmi":["a-kavka-strouhal-cvut-vuv.pdf",["Příspěvek představuje využití GIS nástrojů pro odvození urbanizovaných území České republiky a jejich přispívajících povodí pro potřeby hydrologických analýz a hodnocení ohrožení sídel pluviálními povodněmi. Primární motivací odvození hranic urbanizovaných území je absence jednotné prostorové vrstvy, která by pro hydrologické účely zachycovala skutečnou hranici mezi sídlem a volnou krajinou. Urbanizované území zde proto není chápáno pouze jako administrativní nebo územně-plánovací pojem, ale jako reálná kompaktní struktura zástavby a souvisejících ploch, které významně ovlivňují vznik, koncentraci a směrování povrchového odtoku.","Samotné odvození využívá kombinaci veřejně dostupných prostorových dat, zejména ZABAGED®, LPIS a DMR 4G/5G. Postup zahrnoval klasifikaci vstupních vrstev, práci s vrstvou budov, identifikaci přírodních prvků, prostorové rozhodování nad nejednoznačnými plochami a generalizaci výsledných polygonů. U složitých vrstev byla využita pomocná hexagonální síť, která umožnila přesnější oddělení sídelních a nesídelních struktur. Zpracování bylo realizováno s využitím nástrojů ArcGIS Pro, knihovny ArcPy a navazujících Python skriptů¹.","Součástí příspěvku je také navazující odvození přispívajících povodí, drah soustředěného odtoku, morfologických charakteristik, podílů nepropustných ploch pro jednotlivá nepropustná území. Pro doplnění srážkových a odtokových charakteristik byly využity webprocessingové služby². V prostředí ArcGIS Pro byla vytvořena sada navazujících kroků kombinujících nástroje ArcPy a vybrané nástroje WhiteboxTools.","Vzniklá datová sada je využitelná pro stanovení ohroženosti urbanizovaných území přívalovými srážkami a hodnocení vztahu s okolní krajinou a pro následnou vícekriteriální kategorizaci pomocí clusterové analýzy. Jejím cílem bylo převést rozsáhlou sadu GIS odvozených charakteristik do přehledné typologie urbanizovaných území s obdobným charakterem pluviálního ohrožení a odtokového rizika. Příspěvek zároveň představuje kartografické zpracování výsledků formou souboru map pro jednotlivé kraje České republiky.","^Příspěvek vznikl za podpory projektu TAČR – SS06010386 – „Adaptace urbanizovaných území na přívalové povodně a sucho“.","^¹ STROUHAL, L. and KAVKA, P. Where does a settlement end? Defining urban areas for more than just runoff analyses. Water Management Technical and Economical Information Journal, 2025, vol. 67, No. 4, p. 30–38. ISSN 0322-8916.","^² JEHLIČKA, J., LANDA, M., and KAVKA, P. Czech Land Use and CN analyzer: an open tool for generating CN layers and calculating direct runoff from design rainfall in QGIS. Water Management Technical and Economical Information Journal, 2026, vol. 68, No. 2, p. 32–36. ISSN 0322-8916."]],"Jak prezentovat data o životním prostředí ve veřejné správě":["a-ilcik-koktava-jinag.pdf",["Příspěvek představuje vývoj portálu COOLregion od JINAG od původního nástroje určeného především pro obce a starosty až po platformu sloužící ke komunikaci Akčního klimatického plánu. Ukazuje, jak se z datového portálu zaměřeného na podporu rozhodování v území postupně stal srozumitelný komunikační nástroj, který propojuje environmentální a klimatická data s konkrétními opatřeními, prioritami a potřebami Jihomoravského kraje.","Důraz je kladen na to, jak lze pomocí map, interaktivních aplikací a vizualizací zpřístupnit komplexní témata změny klimatu širšímu okruhu uživatelů – od zástupců samospráv přes odbornou veřejnost až po obyvatele regionu. COOLregion tak ukazuje, jak mohou data ve veřejné správě sloužit nejen jako analytický podklad, ale také jako prostředek pro srozumitelnou komunikaci strategie, plánování a adaptace území na změnu klimatu."]],"Správa rastrových dat v prostředí ArcGIS aneb „Co s těmi rastry?“":["arcdata/a-ws-tesarova-vrtich.pdf",["Máte mnoho snímků z různých území, období a zdrojů, uložených na různých místech? Nebo víte, že kolegové mají data, která by se vám hodila, ale není jednoduché je najít, sdílet a využít? Pojďme si ukázat, jak z množství jednotlivých rastrů vytvořit přehledně spravovaný celek, který bude snadno dostupný pro vizualizaci i další analýzy.","Workshop představí praktické workflow práce s „imagery“ v prostředí ArcGIS – od přípravy a uložení rastrů přes jejich organizaci a správu až po publikaci a sdílení. Na reálných příkladech dronových či leteckých snímků si ukážeme, na co myslet při ukládání dat, jak ovlivňuje jejich další využití zvolený formát nebo komprese.","Podrobněji se zaměříme na Mosaic Dataset a jeho využití pro správu rozsáhlých kolekcí rastrů. Ukážeme si, jak jej využít jako základ pro publikaci v ArcGIS Enterprise nebo ArcGIS Online a vytvořit tak podkladovou vrstvu nebo obrazová data pro další analýzy. Připravená data je pak možné analyzovat s využitím nejnovějších nástrojů nebo propojit s dalšími informacemi v mapách a webových aplikacích.","Cílem workshopu je ukázat, jak z jednotlivých rastrů vytvořit dobře spravovaný a využitelný zdroj dat – od otázky „Kam s těmi rastry?“ až po „Co z nich můžeme zjistit?“"]],"Skenování ze vzduchu i země… a co s daty?":["a-vynikal-3gon.pdf",["Vývoj skenovacích nástrojů pokračuje bleskovou rychlostí. Jsme schopni zmapovat rozsáhlá území do mračna bodů pomocí skenerů na dronu, autě či letadle, a to v centimetrové přesnosti. Umíme skenovat interiéry a podzemní prostory s dosud nevídanou rychlostí díky nové generaci SLAM skenerů. Sbíráme přesná, spolehlivá a hustá data, ale… co pak s nimi?","V našem referátu budeme prezentovat případovou studii, která se alespoň částečně pokusí na otázku odpovědět, tentokrát v oblasti lesnictví. Předvedeme přesné georeferencování a fůzi mračen ze vzduchu i země s pomocí DJI Zenmuse L3 a FARO Orbis pro komplexní zachycení reality. Následně demonstrujeme, jak díky softwaru Terrasolid z dat automatizovaně získat užitečná data o lese, počtu stromů, průměru kmenů a snad i objemu dřeva v lese. To vše s vizí praktického využití v lesnictví s interoperabilitou v GIS."]],"Zeměměřický úřad: Aktuální stav tvorby výškopisu ZABAGED":["a-horak-zu.pdf",["Příspěvek shrnuje stav tvorby a aktualizace výškopisných produktů ZABAGED v Zeměměřickém úřadě, od původních generací DMP 1G, DMR 4G a DMR 5G, až po zcela nový produkt DMP OK, vytvářený metodou obrazové korelace s využitím nástroje ArcGIS Reality Studio."]],"Koncepce zeleně města Ostravy":["a-tracik-mappa.pdf",["Koncepce zeleně je komplexní strategií propojující městskou i příměstskou krajinu do funkčního, odolného a atraktivního systému. Koncepce se zaměřuje na kvalitu a dostupnost zeleně, její propojení, odolnost vůči klimatickým změnám a přiměřenost v kontextu nákladů na realizaci, údržbu ale i rozvoje města. Přináší odpovědi na zásadní otázky: Má Ostrava dostatek zeleně? Jaký je její současný stav a kam se potřebujeme posunout? Je zeleň dostupná pro všechny obyvatele? A jak nastavit priority, aby zelená infrastruktura v Ostravě byla kvalitní, plnila své funkce a zvyšovala kvalitu života ve městě?","Příspěvek představuje koncepci, ukazuje zeleň jako komplexní prostorový systém a přibližuje širší rámec vzniku koncepce, který propojuje urbanistické plánování s terénním mapováním, kvalitativním hodnocením a GIS analýzami. Zaměřuje se i na prezentaci výsledku pomocí interaktivní GIS aplikace."]],"GIS a Science On a Sphere ve vzdělávací praxi":["a-vencl-koubek-sfera-pardubice.pdf",["Vzdělávací centrum SFÉRA v Pardubicích využívá technologii Science On a Sphere jako jedinečný nástroj pro vizualizaci prostorových dat a popularizaci vědy. Součástí vzdělávacích programů jsou také vlastní tematické datasety zaměřené na přírodní vědy, geografii, klimatické změny, oceánografii či historii Země.","Vedle GIS nástrojů budou představeny také postupy využívané při tvorbě animací a multimediálních výstupů, které doplňují vzdělávací obsah promítaný na Science On a Sphere. Ukážeme konkrétní příklady vzdělávacích programů a způsoby, jak převádět odborná geodata do podoby srozumitelné a atraktivní pro žáky, studenty i širokou veřejnost.","Součástí prezentace bude také představení technologie Science On a Sphere, zkušenosti s vývojem vlastních datových podkladů a diskuse nad možnostmi sdílení datasetů a spolupráce mezi institucemi využívajícími tuto technologii. Rádi bychom otevřeli téma širší mezinárodní spolupráce při tvorbě vzdělávacích obsahů a výměně zkušeností napříč komunitou Science On a Sphere."]],"IX. generace mapování brněnského maloobchodu":["a-ambroz-kam-brno.pdf",["Město Brno disponuje unikátní datovou sadou vývoje maloobchodní sítě, která je v pravidelných tří až čtyřletých intervalech sledována od roku 1997. Metodika sběru je za celé sledované období srovnatelná, v jednotlivých průzkumech je postupně rozšiřována, kdy z prostého sběru informací o maloobchodu se průzkum rozšířil v roce 2017 na služby a v roce 2025 i na ubytování a fenomén dnešní doby – výdejní boxy. Přednáška představí metodiku mapování, hlavní výstupy analýzy, otevřená data i webovou aplikaci, která výsledky zpřístupňuje odborné i širší veřejnosti."]],"Multikriteriální GIS analýza rozvojového potenciálu Brněnské metropolitní oblasti":["a-burian-urban-planner.pdf",["Příspěvek představuje využití multikriteriální GIS analýzy pro hodnocení rozvojového potenciálu Brněnské metropolitní oblasti. Řešení navazuje na přípravu Vize prostorového rozvoje BMO, jejímž cílem je vytvořit analytický podklad pro přesnější prostorové směřování rozvoje na metropolitní úrovni. Základem analýzy bylo sjednocení prostorových dat z územních plánů obcí BMO, zejména stavových a návrhových ploch, a jejich následné vyhodnocení pomocí tematicky strukturovaného souboru kritérií.","Multikriteriální hodnocení bylo zaměřeno na posouzení kvality a rozvojových předpokladů území v několika tematických oblastech, mezi které patří zejména majetkové vztahy, kvalita obytného prostředí, lokální, regionální a nadregionální doprava, občanská vybavenost a služby, trh práce a rekreace. Jednotlivá kritéria byla zpracována v prostředí GIS, prostorově vyhodnocena a následně kombinována do dílčích tematických potenciálů i výsledného komplexního rozvojového potenciálu. Významnou součástí řešení bylo rozlišení mezi potenciálem stávajícího územního uspořádání a potenciálem návrhových ploch vymezených v územních plánech.","Výsledky umožňují identifikovat území s vysokým rozvojovým potenciálem, rozvojové osy, stabilizované části metropolitního území i perifernější oblasti s omezenější dostupností služeb, infrastruktury nebo pracovních příležitostí. Analýza zároveň poskytuje podklad pro typologii obcí a pro porovnání plánovaného rozsahu rozvoje s reálnými prostorovými předpoklady jednotlivých částí metropolitní oblasti. Výstupy jsou prezentovány také prostřednictvím interaktivní mapové aplikace, která umožňuje detailní práci s výsledky až na úroveň jednotlivých ploch. Příspěvek tak ukazuje možnosti GIS a multikriteriálního hodnocení jako nástroje pro propojení územního a strategického plánování v metropolitním měřítku."]],"Obohacení městského 3D modelu pomocí deep learningu":["a-plackova-brno.pdf",["3D modely měst by neměly sloužit pouze k vizualizaci území, ale také jako informačně hodnotný podklad pro správu, analýzu a plánování. Příspěvek představí možnosti využití metod deep learningu při obohacování městského 3D modelu o nové tematické informace.","Hlavní pozornost je věnována automatické detekci zelených střech, včetně popisu použitých vstupních dat, přípravy trénovacích vzorků, průběhu detekce, vyhodnocení výsledků a možnosti propojení a využití detekovaných prvků s objekty 3D modelu.","Získané informace mohou sloužit jako například podklad pro plánování zelené infrastruktury, ekodotace nebo další prostorové analýzy. Právě na příkladu zelených střech jsou ukázány přínosy i širší potenciál deep learningu pro zvyšování informační hodnoty městských 3D modelů."]],"Zapojenie AI do generovania územno-plánovacích informácií":["a-polonsky-bratislava.pdf",["Nová legislatíva SR upravujúca územné plánovanie prináša potrebu kvalitných digitálnych podkladov, zatiaľ čo veľká časť existujúcich územných plánov je stále dostupná len v analogickej podobe. Potreba rýchlo a spoľahlivo získavať informácie z územných plánov pritom narastá.","Prezentované riešenie predstavuje nástroj založený na umelej inteligencii, ktorý má tento proces uľahčiť pracovníkom úradov, ako aj odbornej a laickej verejnosti, a pomôcť im lepšie a rýchlejšie sa zorientovať v záväzných častiach územných plánov. Modul AI vo forme tzv. chatbotu odpovedá na dopyty užívateľov ohľadom regulácie územia, základnom funkčnom využívaní, prípustných a neprípustných aktivitách a limitoch územia z hľadiska konkrétnych stavebných zámerov na konkrétnych parcelách, pozemkoch alebo skupinách pozemkov.","Predpokladom vytvorenia a nasadenia AI modulu je dôkladná digitalizácia existujúceho obsahu záväznej časti územného plánu vrátane jeho zmien a doplnkov a vytvorenie adekvátnej databázy regulačných vrstiev. Georeferencia a vektorizácia bola vykonaná v prostredí ArcGIS Pro (Desktop) a bola vypublikovaná do online prostredia ako web layer a následne vytvorená web map a web mapová aplikácia (v Experience Builder).","Technickým pozadím AI modulu je jazykový model gpt-5.5 od spoločnosti OpenAI, ktorý bol následne implementovaný prostredníctvom SDK do prostredia web mapovej aplikácie. Webové vrstvy bežia na ArcGIS Enterprise. V rámci výskumného projektu STICS bol v testovacej verzii modul nasadený pre obec Horné Srnie a mesto Kežmarok, kde spracúva otázky používateľov a odpovedá na základe poskytnutých regulačných dát.","Podľa novej metodiky sa záväzné časti územných plánov už odovzdávajú v štandardizovanej podobe, čím do budúcna odpadne potreba ich dodatočnej digitalizácie. Nasadenie nástroja bude jednoduchšie, a to aj v rôznych etapách spracovania územného plánu. Príkladom využitia je aj lepšia interpretáciu návrhu regulácie územia a získanie spätnej väzby od odbornej a laickej verejnosti."]],"Tipy a triky v ArcGIS 2026":["arcdata/a-ws-maskova-zak.pdf",["Objevte tipy a triky, které vám usnadní každodenní práci v ArcGIS Pro a pomohou využít naplno jeho nové i méně známé možnosti. V praktických ukázkách se zaměříme na efektivnější práci s daty, analýzu, vizualizaci i nastavení prostředí a představíme postupy a novinky z posledních verzí ArcGIS Pro, které dokážou ušetřit čas i zbytečné kroky. Workshop je určen všem, kdo chtějí svou práci v ArcGIS Pro zrychlit, zjednodušit a objevit nové možnosti, které mohou rovnou využít ve své každodenní praxi."]],"Prvky umělé inteligence v ArcGIS":["arcdata/a-ws-vrtich-holubec.pdf",["Různí AI Asistenti se pomalu etablují v jednotlivých komponentách ekosystému Esri. Vladimír Holubec a Matěj Vrtich v rámci workshopu sumarizují stav integrace AI asistentů, na několika praktických ukázkách představí jejich funkcionalitu a neopomenou také zmínit plány dalšího rozvoje. Na své si tak přijdou nejen uživatelé ArcGIS Pro, Map Vieweru, Survey123 a dalších aplikací, ale všichni, které AI (především s přesahem do GIS) zajímá. Kromě vlastních Esri AI nástrojů integrovaných do Esri produktů kolegové neopomenou ani opačnou integraci Esri nástrojů do obecných AI chatbotů skrze MCP protokol."]],"Řízení úkolů v ArcGIS Field Maps":["arcdata/a-ws-radek.pdf",["Nová funkcionalita Tasks v aplikaci ArcGIS Field Maps přináší ucelený nástroj pro efektivní plánování, koordinaci a sledování terénních prací. Tento příspěvek se zaměřuje na využití vrstev úloh k definování, prioritizaci a přidělování pracovních postupů jak z kanceláře, tak přímo z terénu. Účastníci se seznámí s konfigurací v prostředí Field Maps Designer, tvorbou přizpůsobených formulářů a nastavením dynamických filtrů. Představeny budou i klíčové výhody, mezi které patří práce v offline režimu s automatickou synchronizací a průběžné sledování plnění úkolů v reálném čase, což výrazně zlepšuje komunikaci a přehlednost v organizaci."]],"GIS Art":["arcdata/a-ms-maskova.pdf",["GIS nemusí být jen nástrojem pro zpracování dat a tvorbu kartografických výstupů.","V minisemináři se podíváme na jeho kreativnější stránku a ukážeme si, jak lze geografická data využít hravěji a trochu jinak než při běžné práci. Představíme si různé podoby GIS Art, kde hledat inspiraci a jak nad podobnou tvorbou přemýšlet. Spíše, než detailní postupy krok za krokem nabídne miniseminář přehled nápadů, přístupů a nástrojů, které mohou posloužit jako odrazový můstek pro vlastní experimentování s GIS."]],"ArcGIS Data Pipelines – ETL pro webový GIS":["arcdata/a-ms-vrtich.pdf",["ArcGIS Data Pipelines přináší do webového GIS prostředí nástroje pro načítání, čištění, transformaci a kombinování dat bez nutnosti psát vlastní skripty. Zatímco uživatelé ArcGIS Online mohou Data Pipelines využívat již delší dobu, v ArcGIS Enterprise se tato technologie nově (od verze 12.1) objevuje jako samostatná serverová role.","V krátké ukázce si představíme prostředí ArcGIS Data Pipelines a na praktickém příkladu projdeme ETL workflow – od připojení vstupních dat přes jejich úpravu až po vytvoření výsledné vrstvy a automatizaci její aktualizace. Zaměříme se především na to, co příchod Data Pipelines znamená pro uživatele ArcGIS Enterprise a kde mohou doplnit nebo nahradit dosavadní skripty a ruční datové procesy."]],"Survey123 pod lupou: tipy, triky a novinky":["arcdata/a-ms-stepanova.pdf",["Miniseminář nabídne krátký průřez novinkami v Survey123 a zajímavými tipy a triky pro tvorbu a práci s formuláři. Ukážeme si možnosti a funkce, které mohou usnadnit každodenní práci, zefektivnit tvorbu formulářů a nabídnout nové způsoby, jak k jejich návrhu a využití přistupovat."]],"ArcGIS Instant Apps":["arcdata/a-ms-hrabal.pdf",["ArcGIS Instant Apps slouží k efektivní vizualizaci mapových výstupů pomocí okamžitého převodu 2D i 3D dat do webových aplikací bez nutnosti programování. Využití účelově navržených šablon (např. Mapové výřezy, 3D Prohlížeč, Portfolio, apod.) a intuitivního rozhraní zjednodušuje proces publikace, a navíc zajišťuje bezchybné zobrazení aplikace i na mobilních zařízeních. Výsledná mapová řešení tak poskytují přehlednou a srozumitelnou prezentaci geografických informací všem uživatelům."]],"ArcGIS Online: správa obsahu":["arcdata/a-ms-fer.pdf",["Tento miniseminář stručně představí klíčové zásady efektivní správy prostorových dat.","Ukážeme si správnou organizaci vrstev, nastavení přístupových práv přes skupiny, udržování pořádku pomocí metadat a způsoby ochrany dat proti nechtěnému smazání."]],"DTM Connect":["arcdata/a-ms-patkova-mazur.pdf",["Digitální technická mapa se připravuje na přechod na novou verzi Jednotného výměnného formátu JVF DTM 1.5. Co to znamená pro uživatele DTM Connect? V krátkém minisemináři se podíváme na připravovanou aktualizaci DTM Connect a podporu formátu JVF 1.5."]],"ArcGIS Earth":["arcdata/a-ms-holubec.pdf",["ArcGIS Earth je bezplatná aplikace určená k vizualizaci a prozkoumávání geoprostorového obsahu ve 3D na stolních počítačích a mobilních zařízeních. V rámci minisemináře vám tuto jedinečnou a možná trochu opomíjenou aplikaci představíme. Ukážeme si především její mobilní verzi, ve které se podíváme na zobrazení dat v terénu jak ve 3D, tak v experimentálním režimu rozšířené reality."]],"GeoParquet v ArcGIS":["arcdata/a-ms-novak.pdf",["Tento miniseminář vás seznámí s využitím moderního cloud-native formátu GeoParquet v prostředí ArcGIS Pro. Ukážeme si přímé načítání a efektivní vizualizaci rozsáhlých prostorových datových sad bez nutnosti jejich předchozí konverze. Praktické ukázky předvedou práci s kompletními adresáři souborů pomocí Multifile Feature Connection (MFC) i možnosti konverze mezi Geodatabází a GeoParquetem."]],"ArcGIS Living Atlas":["arcdata/a-ms-patkova.pdf",["ArcGIS Living Atlas není jen místo, kde hledáme data. Je to připravený geografický obsah z celého světa, který můžeme rovnou použít. Obsahuje tematická data, podkladové mapy, letecké a družicové snímky, analytické nástroje, modely a další obsah. Přijďte se podívat na novinky, zjistit, jak je můžete využít napříč Esri aplikacemi, a také jak můžete do ArcGIS Living Atlas nominovat vlastní data."]],"Smart mapping":["arcdata/a-ms-cernohousova.pdf",["Smart Mapping neboli inteligentní mapování umožňuje v prostředí Map Viewer vytvářet vizuálně přitažlivé a přehledné mapy během několika kliknutí. V tomto minisemináři se seznámíte s možnostmi, které Smart Mapping nabízí, a dozvíte se, jak efektivně využívat jednotlivé styly vizualizace. Ukážeme si, kde jednotlivé styly najít, jak je přizpůsobit konkrétnímu účelu a pomocí vhodně zvolených barev zvýšit čitelnost i informační hodnotu mapy."]]};
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const trackIdx = id => id === '*' ? -1 : TRACKS.findIndex(x => x.id === id);
const SESSIONS = [], ITEMS = [], BYID = {}, OLD_IDS = {};
/* Stabilní krátký kód položky = den + začátek + místnost, např. s1700j = středa 17:00 Jižní sál.
   Nezávisí na pořadí v datech, takže uložené odkazy zůstanou platné. */
const TCODE = { spol:'s', jiz:'j', ter:'t', mini:'m', stanek:'k', '*':'v' };
const code = (day, track, start) => { const m = Math.round(start);
  return day[0] + String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0') + TCODE[track]; };
RAW.forEach((r, si) => {
  const [day, track, st, en, name, kind, items, loc] = r;
  const s = { id:'s' + si, day, track, start:t(st), end:t(en), name, kind, loc:loc || '', items:[] };
  const n = items.length, dur = (s.end - s.start) / n;
  items.forEach(([title, sp], ii) => {
    const start = s.start + ii * dur;
    const it = { id:code(day, track, start), day, track, sess:s, title, sp, kind,
      start, end:s.start + (ii + 1) * dur, est:n > 1,
      estS:ii > 0,          // začátek je dopočítaný (první přednáška začíná přesně se sekcí)
      estE:ii < n - 1 };    // konec je dopočítaný (poslední končí přesně se sekcí)
    if (BYID[it.id]) console.error('Duplicitní kód položky', it.id);
    OLD_IDS[`${day}-${si}-${ii}`] = it.id;   // převod z ID předchozí verze (localStorage)
    s.items.push(it); ITEMS.push(it); BYID[it.id] = it;
  });
  SESSIONS.push(s);
});
const locName = it => it.track === '*' ? it.sess.loc : TRACKS[trackIdx(it.track)].name;
const cvar = it => it.track === '*' ? 'var(--c-social)' : `var(--c-${it.track})`;
ITEMS.forEach(it => {
  const a = ANN[it.title];
  if (a) it.ann = { url:ANN_BASE + a[0], paras:a[1], text:a[1].map(x => x.replace(/^[§^]/, '')).join(' ') };
  it.hayMain = norm([it.title, it.sess.name, locName(it), ...it.sp.map(p => p.n + ' ' + p.o)].join(' '));
  it.hayAnn = it.ann ? norm(it.ann.text) : '';
  it.hay = it.hayMain + ' ' + it.hayAnn;   // hledá se i v textu anotací
});

/* ---------- Pomocné ---------- */
const fmt = m => { m = Math.round(m); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
const range = it => (it.estS ? '~' : '') + fmt(it.start) + '–' + (it.estE ? '~' : '') + fmt(it.end);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const overlap = (a, b) => a !== b && a.day === b.day && a.start < b.end - 0.01 && b.start < a.end - 0.01;
const pl = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const qTokens = () => norm(state.q).split(/\s+/).filter(Boolean);
const matchQ = (it, toks) => toks.every(tk => it.hay.includes(tk));
const nowInfo = () => { const n = new Date();
  return { iso:`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`,
           m:n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60 }; };

/* ---------- Stav ---------- */
const KEY = 'gis2026-rozvrh-v1';
const narrow = window.matchMedia('(max-width:760px)').matches;
const state = { day:0, view:narrow ? 'list' : 'grid', ppm:narrow ? 3.5 : 4, hidden:new Set(), mine:new Set(), onlyMine:false, theme:'system', q:'', focus:null, selected:null };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s) {
    if (typeof s.day === 'number' && DAYS[s.day]) state.day = s.day;
    if (s.view === 'grid' || s.view === 'list') state.view = s.view;
    if (typeof s.ppm === 'number') state.ppm = Math.min(7, Math.max(2, s.ppm));
    if (Array.isArray(s.hidden)) state.hidden = new Set(s.hidden.filter(id => trackIdx(id) >= 0));
    if (Array.isArray(s.mine)) state.mine = new Set(s.mine.map(id => BYID[id] ? id : OLD_IDS[id]).filter(Boolean));
    state.onlyMine = !!s.onlyMine;
    if (['system', 'light', 'dark'].includes(s.theme)) state.theme = s.theme;
  }
} catch (e) {}

let toastT;
function toast(msg, action, ms) {
  const el = $('toast'); el.innerHTML = msg;
  if (action) {

/* ---------- Odkaz s mým programem (#moje=kód,kód,…) ---------- */
const HKEY = 'moje';
const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
const DAY_ORDER = Object.fromEntries(DAYS.map((d, i) => [d.id, i]));
const mineParam = () => ITEMS.filter(i => state.mine.has(i.id))
  .sort((a, b) => DAY_ORDER[a.day] - DAY_ORDER[b.day] || a.start - b.start).map(i => i.id).join(',');
const baseURL = () => location.href.replace(/[?#].*$/, '');
const shareURL = () => baseURL() + (state.mine.size ? `#${HKEY}=${mineParam()}` : '');
function readLink() {
  let v = null;
  try {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    const q = new URLSearchParams(location.search);
    v = h.has(HKEY) ? h.get(HKEY) : q.has(HKEY) ? q.get(HKEY) : null;
  } catch (e) {}
  return v === null ? null : new Set(v.split(/[,;\s]+/).filter(id => BYID[id]));
}
function syncURL() {   // adresa v adresním řádku vždy odpovídá aktuálnímu výběru → stačí uložit do záložek
  const url = shareURL();
  if (url === location.href) return;
  try { history.replaceState(null, '', url); }
  catch (e) { try { location.replace(state.mine.size ? `#${HKEY}=${mineParam()}` : '#'); } catch (e2) {} }
}
function setMine(set) {
  state.mine = new Set(set); save(); syncURL();
  applyFilters(); updateBadges(); if (state.selected) renderFly();
}
function loadFromLink(fromLink) {
  if (!fromLink || sameSet(fromLink, state.mine)) return;
  const prev = new Set(state.mine);
  setMine(fromLink);
  const firstDay = ITEMS.filter(i => fromLink.has(i.id)).map(i => DAY_ORDER[i.day]).sort()[0];
  if (firstDay !== undefined && !ITEMS.some(i => fromLink.has(i.id) && DAY_ORDER[i.day] === state.day)) {
    if (state.selected) closeFly();
    state.day = firstDay; save(); render(); scroller.scrollTop = 0;
  }
  const n = fromLink.size;
  toast(`Načten program z odkazu: ${n} ${pl(n, 'položka', 'položky', 'položek')}.`,
    prev.size ? { label:'Vrátit můj původní', fn:() => { setMine(prev); toast('Obnoven tvůj původní program.'); } } : null);
}

function applyTheme() {

  const cur = THEMES[state.theme], next = THEMES[cur.next];

function conflicts() {
  const mine = ITEMS.filter(i => state.mine.has(i.id)), out = new Set();
  for (let i = 0; i < mine.length; i++) for (let j = i + 1; j < mine.length; j++)
    if (overlap(mine[i], mine[j])) { out.add(mine[i].id); out.add(mine[j].id); }
  return out;
}

/* ---------- Render: mřížka ---------- */
const GAP = 3;   // musí odpovídat --gap v CSS
function cardHTML(it, top, hgt) {
  const cardH = hgt - 2 * GAP, inner = cardH - 12 - 2, metaH = 15, lh = 17;
  const showMeta = inner >= metaH + lh - 1;
  let lines, showSp = false;
  if (!showMeta) lines = 1;
  else {
    lines = Math.floor((inner - metaH) / lh);
    if (lines >= 3 && it.sp.length) { showSp = true; lines = Math.min(lines - 1, 5); }
    else lines = Math.max(1, Math.min(lines, 6));
  }
  const s = it.sess;
  // Název bloku na každé kartě (karta je srozumitelná i samostatně – při filtrování, hledání, „Můj program“).
  // Ve sloupcích Minisemináře a Stánek ho říká už záhlaví sloupce; u položek pojmenovaných stejně jako blok se neopakuje.
  const label = (it.track === 'mini' || it.track === 'stanek' || it.title === s.name) ? '' : s.name;
  const names = it.sp.map(p => p.n).join(', ');
  return `<button class="talk card${!showMeta ? ' tiny' : ''}" data-id="${it.id}" style="top:${top + GAP}px;height:${cardH}px" title="${esc(range(it) + ' · ' + it.title + (names ? ' — ' + names : ''))}">`
    + (showMeta ? `<span class="meta"><span class="mt">${range(it)}${label ? ` · <b>${esc(label)}</b>` : ''}</span>${it.ann ? `<span class="ann-ind" title="Má anotaci">${svg('doc')}</span>` : ''}</span>` : '')
    + `<span class="ttl" style="-webkit-line-clamp:${lines}">${esc(it.title)}</span>`
    + (showSp ? `<span class="sp">${esc(names)}</span>` : '')
    + `<span class="star-ind">${svg('star', true)}</span></button>`;
}
function renderGrid() {
  const day = DAYS[state.day], ppm = state.ppm;
  const tracks = TRACKS.filter(tr => !state.hidden.has(tr.id));
  const H = (day.end - day.start) * ppm, y = m => (m - day.start) * ppm;
  const hoff = ((60 - day.start % 60) % 60) * ppm, qoff = ((15 - day.start % 15) % 15) * ppm;
  let h = `<div class="sched" style="--cols:${tracks.length};--ppm:${ppm}px;--hoff:${hoff}px;--qoff:${qoff}px">`;
  h += '<div class="sched-head"><div class="corner"></div>' + tracks.map(tr =>
    `<div class="th" style="--c:var(--c-${tr.id})"><span class="dot"></span><div style="min-width:0"><b>${tr.name}</b>${tr.hint ? `<small>${tr.hint}</small>` : ''}</div></div>`).join('') + '</div>';
  h += `<div class="sched-body" style="height:${H}px"><div class="under"><div class="band" id="band"></div></div><div class="axis">`;
  for (let m = Math.ceil(day.start / 30) * 30; m < day.end; m += 30)
    h += `<span class="tick${m % 60 ? ' half' : ''}" style="top:${y(m)}px">${fmt(m)}</span>`;
  h += '</div>';
  for (const tr of tracks) {
    h += `<div class="col" data-track="${tr.id}" style="--c:var(--c-${tr.id})">`;
    for (const s of SESSIONS.filter(s => s.day === day.id && s.track === tr.id)) {
      h += `<div class="sess" style="top:${y(s.start)}px;height:${(s.end - s.start) * ppm}px">`;
      s.items.forEach(it => { h += cardHTML(it, (it.start - s.start) * ppm, (it.end - it.start) * ppm); });
      h += '</div>';
    }
    h += '</div>';
  }
  h += '<div class="overlay"><div class="nowline" id="nowline"><span></span></div>';
  for (const s of SESSIONS.filter(s => s.day === day.id && s.track === '*')) {
    const it = s.items[0], endV = Math.min(s.end, day.end);
    h += `<button class="talk card span-ev" data-id="${it.id}" style="--c:var(--c-social);top:${y(s.start) + GAP}px;height:${(endV - s.start) * ppm - 2 * GAP}px"><b>${esc(s.name)}</b><span>${fmt(s.start)}–${fmt(s.end)} · ${esc(s.loc)}</span>${s.end > day.end ? `<i>pokračuje až do ${fmt(s.end)} ↓</i>` : ''}<span class="star-ind">${svg('star', true)}</span></button>`;
  }
  h += '</div></div></div>';
  scroller.innerHTML = h;
}

/* ---------- Render: seznam ---------- */
function renderList() {

/* ---------- Filtry, zvýraznění, teď ---------- */
function applyFilters() {
  const toks = qTokens(), conf = conflicts();
  let cnt = 0;
  scroller.querySelectorAll('.talk').forEach(el => {
    const it = BYID[el.dataset.id];
    const mq = !toks.length || matchQ(it, toks);
    const ok = mq && (!state.onlyMine || state.mine.has(it.id));
    el.classList.toggle('filtered', !ok);
    el.classList.toggle('match', toks.length > 0 && mq);
    el.classList.toggle('starred', state.mine.has(it.id));
    el.classList.toggle('conflict', conf.has(it.id));
    if (toks.length && mq) cnt++;
  });
  $('qcount').textContent = toks.length ? `${cnt} ${pl(cnt, 'shoda', 'shody', 'shod')}` : '';
  $('searchBox').classList.toggle('has-q', state.q.length > 0);
  renderTabs();
}
function applyFocus() {
  const fid = state.selected || state.focus, fi = fid && BYID[fid];
  const day = DAYS[state.day];
  const on = !!fi && fi.day === day.id && state.view === 'grid';
  scroller.classList.toggle('focusing', on);
  scroller.querySelectorAll('.talk').forEach(el => {
    const it = BYID[el.dataset.id];
    el.classList.toggle('focused', !!fi && it === fi);
    el.classList.toggle('conc', !!fi && overlap(it, fi));
    const sess = el.parentElement;
    if (sess.classList.contains('sess') && el === sess.firstElementChild)
      sess.classList.toggle('hl', on && fi.sess === it.sess);
  });
  const band = $('band');
  if (band && on) { band.style.top = (fi.start - day.start) * state.ppm + 'px'; band.style.height = (fi.end - fi.start) * state.ppm + 'px'; }
}
function updateNow() {
  const nl = $('nowline'); if (!nl) return;
  const day = DAYS[state.day], n = nowInfo();
  if (n.iso === day.iso && n.m >= day.start && n.m <= day.end) {
    nl.style.display = 'block'; nl.style.top = (n.m - day.start) * state.ppm + 'px';
    nl.firstElementChild.textContent = 'Teď ' + fmt(n.m);
  } else nl.style.display = 'none';
}
function scrollToNow() {
  const day = DAYS[state.day], n = nowInfo();
  if (n.iso !== day.iso) return;
  if (state.view === 'grid') scroller.scrollTop = Math.max(0, (n.m - day.start) * state.ppm - scroller.clientHeight / 3);
  else { const el = scroller.querySelector('.live-chip'); el && el.closest('.row').scrollIntoView({ block:'center' }); }

function render() {

/* ---------- Detail (flyout) ---------- */
function miniRow(o, cur, showLoc) {
  const st = state.mine.has(o.id);
  return `<button class="mrow${cur ? ' cur' : ''}" data-goto="${o.id}" style="--c:${cvar(o)}"><span class="dot"></span><span><small>${range(o)}${showLoc ? ' · ' + esc(locName(o)) : ''}</small><span class="mt">${esc(o.title)}</span></span>${st ? svg('star', true) : '<span></span>'}</button>`;
}
/* Zvýraznění hledaných výrazů v anotaci bez ohledu na diakritiku (normalizace po znacích zachová pozice) */
function hilite(text, toks) {
  if (!toks.length) return esc(text);
  const chars = [...text], nchars = chars.map(c => norm(c) || c), ntext = nchars.join('');
  if (ntext.length !== text.length) return esc(text);   // pojistka pro neobvyklé znaky
  const mark = new Array(chars.length).fill(false);
  for (const tk of toks) { let i = ntext.indexOf(tk); while (i >= 0) { for (let k = i; k < i + tk.length; k++) mark[k] = true; i = ntext.indexOf(tk, i + tk.length); } }
  let out = '', open = false;
  chars.forEach((c, i) => { if (mark[i] && !open) { out += '<mark>'; open = true; } if (!mark[i] && open) { out += '</mark>'; open = false; } out += esc(c); });
  return out + (open ? '</mark>' : '');
}
let annOpenFor = null;   // u které položky je dlouhá anotace rozbalená
function annHTML(it) {
  if (!it.ann) return '';
  const toks = qTokens(), inAnn = toks.length && toks.some(tk => it.hayAnn.includes(tk)) && !toks.every(tk => it.hayMain.includes(tk));
  const long = it.ann.text.length > 520, open = !long || annOpenFor === it.id || inAnn;
  const body = it.ann.paras.map(p => p[0] === '§' ? `<h5>${hilite(p.slice(1), toks)}</h5>`
    : p[0] === '^' ? `<p class="ann-note">${hilite(p.slice(1), toks)}</p>` : `<p>${hilite(p, toks)}</p>`).join('');
  return `<h4>Anotace <a class="ann-pdf" href="${it.ann.url}" target="_blank" rel="noopener" title="Otevřít původní PDF na webu pořadatele">${svg('doc')}PDF</a></h4>`
    + (inAnn ? `<div class="ann-hit">${svg('search')}Hledaný výraz se vyskytuje v anotaci.</div>` : '')
    + `<div class="ann${open ? '' : ' collapsed'}"><div class="ann-text">${body}</div>`
    + (long ? `<button type="button" class="ann-toggle" data-ann-toggle>${open ? 'Sbalit anotaci' : 'Zobrazit celou anotaci'}</button>` : '') + '</div>';
}
function renderFly() {
  const it = BYID[state.selected]; if (!it) return;
  const s = it.sess, day = DAYS.find(d => d.id === it.day), st = state.mine.has(it.id), conf = conflicts();
  const conc = ITEMS.filter(o => overlap(o, it)).sort((a, b) => trackIdx(a.track) - trackIdx(b.track) || a.start - b.start);
  const n = s.items.length;
  flyout.innerHTML =
    `<div class="fly-head" style="--c:${cvar(it)}"><span class="dot"></span><span class="fly-loc">${esc(locName(it))}</span>`
    + `<button type="button" class="ibtn${st ? ' on' : ''}" data-star-fly title="${st ? 'Odebrat z mého programu' : 'Přidat do mého programu'}" aria-label="${st ? 'Odebrat z mého programu' : 'Přidat do mého programu'}" aria-pressed="${st}">${svg('star')}</button>`
    + `<button type="button" class="ibtn" data-ics title="Přidat do kalendáře (.ics)" aria-label="Přidat do kalendáře">${svg('cal')}</button>`
    + `<button type="button" class="ibtn" data-close title="Zavřít (Esc)" aria-label="Zavřít">${svg('dismiss')}</button></div>`
    + `<div class="fly-body" style="--c:${cvar(it)}">`
    + `<div class="eyebrow">${esc(s.kind === 'mini' ? 'Miniseminář' : s.name)}</div><h2>${esc(it.title)}</h2>`
    + `<div class="info">${svg('clock')}<div><b>${day.label} ${day.date}</b> · ${range(it)}</div></div>`
    + (it.estS || it.estE ? `<div class="est-note">${it.estS && it.estE ? 'Začátek i konec jsou odhad' : it.estS ? 'Začátek je odhad' : 'Konec je odhad'}, skutečnost se může lišit.</div>` : '')
    + `<div class="info">${svg('pin')}<div>${esc(locName(it))}</div></div>`

    + annHTML(it)
    + (it.sp.length ? `<h4>Přednášející</h4><ul class="speakers">${it.sp.map(p => `<li><b>${esc(p.n)}</b>${p.o ? `<span>${esc(p.o)}</span>` : ''}</li>`).join('')}</ul>` : '')
    + (n > 1 ? `<h4>Program sekce</h4><div class="mlist">${s.items.map(o => miniRow(o, o === it, false)).join('')}</div>` : '')
    + `<h4>Ve stejný čas probíhá ${conc.length ? `<span class="pill">${conc.length}</span>` : ''}</h4>`
    + (conc.length ? `<div class="mlist">${conc.map(o => miniRow(o, false, true)).join('')}</div>` : '<p class="muted">V tomto čase neprobíhá nic jiného.</p>')
    + '</div>';
}
function openFly(id, scroll) {
