<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program konference GIS 2026</title>
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --bg:#f3f3f3;
  --mica:radial-gradient(1200px 640px at 0% 0%,#e3ecf8 0%,transparent 60%),radial-gradient(900px 520px at 100% 0%,#efe8f8 0%,transparent 55%),#f3f3f3;
  --layer:#fbfbfb; --surface:#ffffff; --surface-h:#f7f7f7; --subtle:#f0f0f0; --subtle-h:#e6e6e6;
  --stroke:#e3e3e3; --stroke-s:#d1d1d1; --grid:#e4e4e4; --grid-q:#f1f1f1;
  --fg:#1a1a1a; --fg2:#424242; --fg3:#616161; --fg4:#8a8a8a;
  --brand:#0f6cbd; --brand-bg:#0f6cbd; --brand-bg-h:#115ea3; --brand-tint:#ebf3fc;
  --danger:#c50f1f; --danger-tint:#fdf3f4;
  --gold:#e8a200; --gold-bg:#fff4ce; --gold-fg:#835b00;
  --acrylic:rgba(250,250,250,.78);
  --sh2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);
  --sh4:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);
  --sh8:0 0 2px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.14);
  --sh28:0 0 8px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.18);
  --c-spol:#0f6cbd; --c-jiz:#038387; --c-ter:#8764b8; --c-mini:#ca5010; --c-stanek:#107c10; --c-social:#c239b3;
  --tint:9%;
  --axisw:64px; --colmin:214px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1c;
    --mica:radial-gradient(1200px 640px at 0% 0%,#1b2838 0%,transparent 60%),radial-gradient(900px 520px at 100% 0%,#28203a 0%,transparent 55%),#1c1c1c;
    --layer:#232323; --surface:#2d2d2d; --surface-h:#353535; --subtle:#2f2f2f; --subtle-h:#3b3b3b;
    --stroke:#3a3a3a; --stroke-s:#4b4b4b; --grid:#343434; --grid-q:#2a2a2a;
    --fg:#ffffff; --fg2:#d6d6d6; --fg3:#adadad; --fg4:#858585;
    --brand:#479ef5; --brand-bg:#115ea3; --brand-bg-h:#0f6cbd; --brand-tint:#0e2a47;
    --danger:#f1707b; --danger-tint:#3b1a1d;
    --gold:#ffc83d; --gold-bg:#463100; --gold-fg:#ffd96b;
    --acrylic:rgba(36,36,36,.8);
    --sh2:0 0 2px rgba(0,0,0,.24),0 1px 2px rgba(0,0,0,.28);
    --sh4:0 0 2px rgba(0,0,0,.24),0 2px 4px rgba(0,0,0,.28);
    --sh8:0 0 2px rgba(0,0,0,.24),0 4px 8px rgba(0,0,0,.28);
    --sh28:0 0 8px rgba(0,0,0,.24),0 14px 28px rgba(0,0,0,.4);
    --c-spol:#479ef5; --c-jiz:#4dc4c8; --c-ter:#b696e0; --c-mini:#f29d61; --c-stanek:#6ccb5f; --c-social:#ee8fe6;
    --tint:15%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1c;
  --mica:radial-gradient(1200px 640px at 0% 0%,#1b2838 0%,transparent 60%),radial-gradient(900px 520px at 100% 0%,#28203a 0%,transparent 55%),#1c1c1c;
  --layer:#232323; --surface:#2d2d2d; --surface-h:#353535; --subtle:#2f2f2f; --subtle-h:#3b3b3b;
  --stroke:#3a3a3a; --stroke-s:#4b4b4b; --grid:#343434; --grid-q:#2a2a2a;
  --fg:#ffffff; --fg2:#d6d6d6; --fg3:#adadad; --fg4:#858585;
  --brand:#479ef5; --brand-bg:#115ea3; --brand-bg-h:#0f6cbd; --brand-tint:#0e2a47;
  --danger:#f1707b; --danger-tint:#3b1a1d;
  --gold:#ffc83d; --gold-bg:#463100; --gold-fg:#ffd96b;
  --acrylic:rgba(36,36,36,.8);
  --sh2:0 0 2px rgba(0,0,0,.24),0 1px 2px rgba(0,0,0,.28);
  --sh4:0 0 2px rgba(0,0,0,.24),0 2px 4px rgba(0,0,0,.28);
  --sh8:0 0 2px rgba(0,0,0,.24),0 4px 8px rgba(0,0,0,.28);
  --sh28:0 0 8px rgba(0,0,0,.24),0 14px 28px rgba(0,0,0,.4);
  --c-spol:#479ef5; --c-jiz:#4dc4c8; --c-ter:#b696e0; --c-mini:#f29d61; --c-stanek:#6ccb5f; --c-social:#ee8fe6;
  --tint:15%;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);font-size:14px;color:var(--fg);
  background:var(--mica);background-color:var(--bg);background-attachment:fixed;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:1px;border-radius:4px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}

/* App bar */
/* Horní panel – leží přímo na pozadí stránky (bez vlastního pruhu), stejné materiály jako ovládací prvky níže */
.appbar{display:flex;align-items:center;gap:20px;padding:18px 20px 8px;flex:none}
.titlebox{min-width:0}
.titlebox h1{font-family:var(--font-d);font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.012em;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:5px;font-size:13px;color:var(--fg3)}
.meta-row .mi{display:inline-flex;align-items:center;gap:6px}
.status-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--brand-tint);color:var(--brand)}
.status-pill:empty{display:none}
.status-pill.live{background:var(--danger-tint);color:var(--danger)}
.status-pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
.status-pill.past{background:var(--subtle-h);color:var(--fg3)}
@keyframes pulse{50%{opacity:.35}}
.app-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.search{position:relative;width:min(420px,36vw);display:flex;align-items:center}
.search > .ic{position:absolute;left:11px;color:var(--fg3);pointer-events:none}
.search input{width:100%;height:36px;padding:0 44px 0 36px;border:1px solid var(--stroke);border-radius:6px;background:var(--surface);
  color:var(--fg);font:inherit;font-size:14px;outline:none;box-shadow:var(--sh2);
  transition:border-color var(--fade) var(--ease),box-shadow var(--fade) var(--ease)}
.search input::placeholder{color:var(--fg4)}
.search input:hover{border-color:var(--stroke-s)}
.search input:focus{border-color:var(--stroke-s);box-shadow:inset 0 -2px 0 var(--brand),var(--sh4)}
.search input::-webkit-search-cancel-button{display:none}
.search.has-q input{padding-right:112px}
.search .tail{position:absolute;right:6px;display:flex;align-items:center;gap:2px}
.search kbd{font:600 11px/1 var(--font);color:var(--fg3);border:1px solid var(--stroke-s);border-bottom-width:2px;border-radius:4px;padding:3px 6px;background:var(--layer)}
.search input:focus ~ .tail kbd,.search.has-q kbd{display:none}
#qcount{font-size:12px;color:var(--fg3);margin-right:2px;white-space:nowrap}
#qclear{display:none;width:26px;height:26px;border:0;border-radius:4px;background:transparent;color:var(--fg3);cursor:pointer;place-items:center}
#qclear .ic{width:14px;height:14px}
#qclear:hover{background:var(--subtle-h);color:var(--fg)}
.search.has-q #qclear{display:grid}
/* Přepínač motivu – jedno tlačítko, ikona ukazuje aktuální stav; stejný materiál a výška jako pole hledání */
.hdr-btn{width:36px;height:36px;flex:none;border:1px solid var(--stroke);border-radius:6px;background:var(--surface);box-shadow:var(--sh2);
  color:var(--fg2);display:grid;place-items:center;cursor:pointer;transition:background-color var(--fade) var(--ease),border-color var(--fade) var(--ease)}
.hdr-btn:hover{background:var(--surface-h);border-color:var(--stroke-s);color:var(--fg)}
.hdr-btn .ic{width:18px;height:18px}
.icon-btn{width:32px;height:32px;border-radius:4px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg2);flex:none}
.icon-btn:hover{background:var(--subtle-h)}

/* Toolbar */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:6px 20px 0;flex:none}
.tb-mine{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-view{display:flex;align-items:center;gap:6px}
/* Ikonová tlačítka (odkaz, kalendář, vymazat, celá obrazovka) */
.ibtns{display:flex;align-items:center;gap:2px}
.ibtn{width:32px;height:32px;flex:none;border:0;border-radius:4px;background:transparent;color:var(--fg2);display:grid;place-items:center;cursor:pointer;
  transition:background-color var(--fade) var(--ease),color var(--fade) var(--ease)}
.ibtn:hover{background:var(--subtle-h);color:var(--fg)}
.ibtn[hidden]{display:none}
.ibtn .ic{width:18px;height:18px}
.ibtn.on{color:var(--gold)}
.ibtn.on .ic{fill:currentColor}
.pivot{display:flex;gap:2px}
.pivot button{position:relative;border:0;background:transparent;padding:10px 12px 12px;font-size:14px;color:var(--fg2);cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;gap:6px}
.pivot button:hover{background:var(--subtle)}
.pivot button.on{color:var(--fg);font-weight:600}
.pivot button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--brand)}
.pivot .d{color:var(--fg3);font-weight:400}
.pivot .ds{display:none}
.pill{font-size:11px;font-weight:600;line-height:16px;padding:0 6px;border-radius:999px;background:var(--subtle-h);color:var(--fg2)}
.pill.star{background:var(--gold-bg);color:var(--gold-fg)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;user-select:none;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:40px;height:20px;border-radius:10px;border:1px solid var(--fg3);position:relative;transition:background .15s,border-color .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg2);transition:left .15s}
.switch input:checked + .trk{background:var(--brand-bg);border-color:transparent}
.switch input:checked + .trk::after{left:23px;background:#fff}
.switch input:focus-visible + .trk{outline:2px solid var(--fg);outline-offset:2px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand-bg);color:#fff;font-size:11px;font-weight:600}
.badge.warn{background:var(--danger);color:#fff}
.badge:empty{display:none}
.btn{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--stroke-s);background:var(--surface);color:var(--fg);
  font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-h)}
.btn.primary{background:var(--brand-bg);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--brand-bg-h)}
.btn.subtle{background:transparent;border-color:transparent;font-weight:400}
.btn[hidden]{display:none}
.btn.subtle:hover{background:var(--subtle-h)}
.seg{display:inline-flex;border:1px solid var(--stroke-s);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;font-size:13px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.seg button + button{border-left:1px solid var(--stroke)}
.seg button:hover:not(:disabled){background:var(--subtle)}
.seg button.on{background:var(--brand-tint);color:var(--brand);font-weight:600}
.seg button:disabled{opacity:.4;cursor:default}

/* Chips */
.chips-row{display:flex;align-items:center;gap:8px;padding:10px 20px 12px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
#fsExit{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--stroke);
  background:var(--surface);font-size:12.5px;color:var(--fg2);cursor:pointer;box-shadow:var(--sh2)}
.chip:hover{background:var(--surface-h)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.off{background:transparent;color:var(--fg4);box-shadow:none}
.chip.off .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}

/* Main */
main{flex:1;min-height:0;padding:0 20px}
.scroller{height:100%;overflow:auto;background:var(--layer);border:1px solid var(--stroke);border-radius:8px;box-shadow:var(--sh4);position:relative;overscroll-behavior:contain}

/* Grid */
.sched{min-width:calc(var(--axisw) + var(--cols) * var(--colmin))}
.sched-head,.sched-body{display:grid;grid-template-columns:var(--axisw) repeat(var(--cols),minmax(var(--colmin),1fr))}
.sched-head{position:sticky;top:0;z-index:7;background:var(--acrylic);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border-bottom:1px solid var(--stroke)}
.corner{position:sticky;left:0;z-index:8;background:var(--layer);border-right:1px solid var(--stroke)}
.th{padding:10px 12px;display:flex;align-items:center;gap:9px;font-size:13px;border-left:1px solid var(--stroke);min-width:0}
.th:first-of-type{border-left:0}
.th .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.th b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th small{display:block;color:var(--fg3);font-size:11px}
.sched-body{position:relative}
.axis{position:sticky;left:0;z-index:6;background:var(--layer);border-right:1px solid var(--stroke)}
.tick{position:absolute;right:9px;transform:translateY(-50%);font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;font-weight:600}
.tick.half{font-size:10px;color:var(--fg4);font-weight:400}
.col{position:relative;border-left:1px solid var(--stroke);
  background:
    repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px calc(var(--ppm) * 60)) 0 var(--hoff) / 100% auto,
    repeating-linear-gradient(to bottom,var(--grid-q) 0 1px,transparent 1px calc(var(--ppm) * 15)) 0 var(--qoff) / 100% auto}
.col:nth-child(2){border-left:0}
.under,.overlay{position:absolute;top:0;bottom:0;left:var(--axisw);right:0;pointer-events:none}
.under{z-index:0}
.overlay{z-index:5}
/* ZVÝRAZNĚNÍ – jedna animace pro všechny prvky (pás, obrys, stín, ztlumení, podbarvení sekce):
   stejná délka i průběh TAM i ZPĚT. Přechody jsou definované jen na výchozím stavu, žádný stav je nepřepisuje. */
:root{--fade:.1s;--ease:ease-out}
.band{position:absolute;left:0;right:0;opacity:0;transition:opacity var(--fade) var(--ease);background:color-mix(in srgb,var(--brand) 9%,transparent);
  border-top:1px dashed color-mix(in srgb,var(--brand) 55%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--brand) 55%,transparent)}
.focusing .band{opacity:1}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);display:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.nowline span{position:absolute;left:10px;top:-20px;font-size:11px;font-weight:600;color:#fff;background:var(--danger);padding:1px 7px;border-radius:999px}

/* --gap = stejný odstup karty od okraje slotu ve všech směrech (vodorovně i svisle) */
.sched{--gap:3px}
/* Podbarvení sekce jen u zvýrazněné položky (třída .hl nastavovaná spolu s ostatním zvýrazněním) */
.sess{position:absolute;left:0;right:0;border-radius:7px;background:transparent;transition:opacity var(--fade) var(--ease),background-color var(--fade) var(--ease)}
.sess.hl{background:color-mix(in srgb,var(--c) var(--tint),transparent)}
.sess:not(:has(.card:not(.filtered))){opacity:.35}
.card{position:absolute;left:var(--gap);right:var(--gap);display:flex;flex-direction:column;text-align:left;padding:6px 8px 6px 11px;
  border-radius:5px;border:1px solid var(--stroke);background:var(--surface);overflow:hidden;cursor:pointer;
  box-shadow:inset 3px 0 0 var(--c),var(--sh2);transition:box-shadow var(--fade) var(--ease),opacity var(--fade) var(--ease),background-color var(--fade) var(--ease)}
.card:hover{background:var(--surface-h);box-shadow:inset 3px 0 0 var(--c),var(--sh8);z-index:2}
.card:focus-visible{outline-offset:-2px}
.card.tiny{padding-top:2px;padding-bottom:2px;justify-content:center}
.card .meta{font-size:11px;line-height:15px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;flex:none}
.card .meta b{color:var(--c);font-weight:600}
/* Název přednášky: polotučný řez 600 (dostupný ve Segoe UI, SF i většině systémových písem → všude stejný).
   Lehčí dojem dělá větší písmo, o něco větší prostrkání a mírně změkčená barva (ne čistě černá/bílá). */
.card .ttl{font-size:13px;line-height:17px;font-weight:600;letter-spacing:.004em;color:color-mix(in srgb,var(--fg) 86%,var(--surface));display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.card .sp{font-size:11.5px;line-height:15px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.star-ind{position:absolute;top:4px;right:5px;color:var(--gold);display:none}
.star-ind .ic{width:13px;height:13px}
.card.starred .star-ind{display:block}
.card.starred .meta,.card.starred.tiny .ttl{padding-right:14px}
.card.conflict{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--c),0 0 0 1px var(--danger),var(--sh2)}
.card.conflict .star-ind{color:var(--danger)}
.card.match{background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.card.filtered{opacity:.16;pointer-events:none;filter:saturate(.3)}
.grid-mode.focusing .card:not(.focused):not(.conc):not(.filtered){opacity:.3}
.grid-mode.focusing .card.conc{box-shadow:inset 3px 0 0 var(--c),var(--sh8)}
.card.focused{box-shadow:inset 3px 0 0 var(--c),0 0 0 2px var(--brand),var(--sh8);z-index:3}

.card.span-ev.conflict{box-shadow:0 0 0 1px var(--danger)}
.card.span-ev .star-ind{top:8px;right:10px}
.card.span-ev:not(.conflict) .star-ind{color:var(--gold)}
.card.span-ev .star-ind .ic{width:16px;height:16px}
.card.span-ev{flex-direction:row;align-items:center;justify-content:center;gap:12px;pointer-events:auto;
  border:1px dashed var(--c);box-shadow:none;text-align:center;flex-wrap:wrap;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--layer)) 0 12px,color-mix(in srgb,var(--c) 8%,var(--layer)) 12px 24px)}
.card.span-ev:hover{box-shadow:var(--sh8)}
.card.span-ev b{font-size:14px;font-weight:600}
.card.span-ev span{font-size:12.5px;color:var(--fg2)}
.card.span-ev i{font-size:12px;color:var(--fg3);font-style:normal}

/* List */
.list{max-width:1000px;margin:0 auto;padding:4px 16px 40px}
.list section:not(:has(.row:not(.filtered))){display:none}
.list h3{position:sticky;top:0;z-index:2;margin:0;padding:14px 4px 6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);background:var(--layer)}
.row{display:grid;grid-template-columns:118px 4px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;margin:0 0 6px;
  border:1px solid var(--stroke);border-radius:6px;background:var(--surface);box-shadow:var(--sh2);cursor:pointer;transition:background-color var(--fade) var(--ease),box-shadow var(--fade) var(--ease)}
.row:hover{background:var(--surface-h);box-shadow:var(--sh8)}
.row.filtered{display:none}
.row.match{background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.row.focused{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--sh4)}
.row.conflict{border-color:var(--danger)}
.r-time{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.r-bar{align-self:stretch;border-radius:2px;background:var(--c)}
.r-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.r-sub{font-size:12px;color:var(--fg3)}
.r-ttl{font-size:14px;font-weight:600;line-height:19px}
.r-sp{font-size:12.5px;color:var(--fg2)}
.r-side{display:flex;align-items:center;gap:8px}
.conc-chip{font-size:11px;color:var(--fg3);border:1px solid var(--stroke);border-radius:999px;padding:1px 8px;white-space:nowrap}
.live-chip{font-style:normal;font-size:11px;font-weight:600;color:#fff;background:var(--danger);border-radius:999px;padding:0 7px;margin-left:6px}
.star-btn{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;color:var(--fg3);cursor:pointer}
.star-btn:hover{background:var(--subtle-h)}
.star-btn .fill{display:none;color:var(--gold)}
.starred .star-btn .fill{display:block}
.starred .star-btn .ic:not(.fill){display:none}
.empty{display:none;text-align:center;color:var(--fg3);padding:48px 0}
.list:not(:has(.row:not(.filtered))) .empty{display:block}

/* Flyout */
.flyout{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:50;display:flex;flex-direction:column;overflow:hidden;
  background:var(--acrylic);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);
  border-left:1px solid var(--stroke);box-shadow:var(--sh28);
  transform:translateX(calc(100% + 32px));visibility:hidden;
  transition:transform .28s cubic-bezier(.1,.9,.2,1),visibility 0s linear .28s}
.flyout.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.1,.9,.2,1),visibility 0s}
.fly-head{display:flex;align-items:center;gap:4px;padding:10px 8px 4px 18px;flex:none}
.fly-head .dot{margin-right:5px}
.fly-head .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.fly-loc{font-size:13px;font-weight:600;color:var(--fg2);flex:1}
.fly-body{overflow:auto;padding:0 18px 20px}
.eyebrow{font-size:12px;font-weight:600;color:var(--c);margin-top:6px}
.fly-body h2{font-family:var(--font-d);font-size:20px;line-height:26px;font-weight:600;margin:4px 0 12px}
.info{display:flex;gap:10px;align-items:flex-start;color:var(--fg2);font-size:13.5px;margin:7px 0}
.info .ic{color:var(--fg3);margin-top:2px}
.est-note{font-size:12px;line-height:16px;color:var(--fg3);margin:-3px 0 9px 26px}
.warn-box{display:flex;gap:8px;font-size:12.5px;color:var(--danger);background:var(--danger-tint);border-radius:6px;padding:8px 10px;margin:10px 0}
.fly-body h4{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);margin:20px 0 6px;display:flex;align-items:center;gap:6px}
.speakers{list-style:none;margin:0;padding:0}
/* Anotace v detailu */
.fly-body h4 .ann-pdf{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--brand);text-decoration:none;padding:2px 6px;border-radius:4px}
.fly-body h4 .ann-pdf:hover{background:var(--subtle-h)}
.fly-body h4 .ann-pdf .ic{width:14px;height:14px}
.ann-text{font-size:13.5px;line-height:20px;color:var(--fg2)}
.ann-text p{margin:0 0 8px}
.ann-text h5{margin:12px 0 4px;font-size:13.5px;font-weight:600;color:var(--fg)}
.ann-text .ann-note{font-size:12px;line-height:17px;color:var(--fg3)}
.ann-text mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:2px}
.ann.collapsed .ann-text{max-height:150px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.ann-toggle{border:0;background:transparent;color:var(--brand);font:inherit;font-size:13px;font-weight:600;padding:4px 6px;margin:0 -6px;border-radius:4px;cursor:pointer}
.ann-toggle:hover{background:var(--subtle-h)}
.ann-hit{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gold-fg);background:var(--gold-bg);border-radius:6px;padding:5px 8px;margin:0 0 8px}
.ann-hit .ic{width:14px;height:14px}
/* Indikátor „má anotaci“ */
.card .meta{display:flex;align-items:center;gap:4px}
.card .meta .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ann-ind{flex:none;color:var(--fg4);display:flex}
.ann-ind .ic{width:13px;height:13px}
.ann-ind-row{color:var(--fg4);display:flex}
.ann-ind-row .ic{width:15px;height:15px}
.speakers li{padding:7px 0;border-top:1px solid var(--stroke)}
.speakers li:first-child{border-top:0}
.speakers b{display:block;font-weight:600;font-size:13.5px}
.speakers span{font-size:12.5px;color:var(--fg3)}
.mlist{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;padding:7px 8px;border:0;border-radius:6px;background:transparent;cursor:pointer}
.mrow:hover{background:var(--subtle-h)}
.mrow.cur{background:var(--brand-tint)}
.mrow .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:4px}
.mrow small{display:block;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.mrow .mt{font-size:13px;font-weight:600;line-height:17px}
.mrow > .ic{color:var(--gold);margin-top:3px}
.muted{color:var(--fg3);font-size:13px;margin:4px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}

/* Nápověda – dialog uprostřed obrazovky */
.modal-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity var(--fade) var(--ease)}
.modal-scrim.show{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;z-index:71;width:min(620px,calc(100vw - 24px));max-height:min(86dvh,760px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--stroke);border-radius:10px;box-shadow:var(--sh28);overflow:hidden;
  transform:translate(-50%,-49%) scale(.985);opacity:0;visibility:hidden;
  transition:opacity var(--fade) var(--ease),transform var(--fade) var(--ease),visibility 0s linear var(--fade)}
.modal.open{transform:translate(-50%,-50%);opacity:1;visibility:visible;transition:opacity var(--fade) var(--ease),transform var(--fade) var(--ease),visibility 0s}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 12px 8px 22px;flex:none}
.modal-head h2{flex:1;margin:0;font-family:var(--font-d);font-size:20px;line-height:26px;font-weight:600}
.modal-body{overflow:auto;padding:0 22px 22px;font-size:13.5px;line-height:20px;color:var(--fg2)}
.modal-body h3{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3)}
.modal-body h3:first-child{margin-top:4px}
.modal-body ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.modal-body li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.modal-body li > .k{display:grid;place-items:center;height:20px;color:var(--fg2);font-weight:600}
.modal-body li > .k .ic{width:17px;height:17px}
.modal-body li > .k .dots{display:flex;gap:2px}
.modal-body li > .k .dots i{width:6px;height:6px;border-radius:50%}
.modal-body b{color:var(--fg);font-weight:600}
.modal-body kbd{font:600 11px/1 var(--font);color:var(--fg2);border:1px solid var(--stroke-s);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--layer)}
.modal-body .src{margin:18px 0 0;font-size:12.5px;color:var(--fg3)}
.modal-body a{color:var(--brand)}

/* Toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:60;pointer-events:none;
  background:var(--acrylic);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--stroke);
  border-radius:8px;box-shadow:var(--sh28);padding:10px 16px;font-size:13.5px;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.show .toast-act{pointer-events:auto}
.toast-act{margin-left:12px;border:0;background:transparent;color:var(--brand);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 6px;border-radius:4px}
.toast-act:hover{background:var(--subtle-h)}
.toast small{color:var(--fg3)}

/* Režim celé obrazovky: jen filtr sálů a program */
body.compact .appbar,body.compact .toolbar{display:none}
body.compact #fsExit{display:grid}
body.compact .chips-row{padding-top:10px}
#zoomSeg[hidden]{display:none}

@media (max-width:760px){
  :root{--axisw:52px;--colmin:184px}
  .appbar{flex-wrap:wrap;padding:14px 12px 6px;gap:10px}
  .titlebox h1{font-size:19px;line-height:25px}
  .meta-row{margin-top:3px;font-size:12.5px}
  .app-actions{width:100%;margin-left:0}
  .search{flex:1;width:auto}
  .search kbd{display:none}
  /* Lišta na malém displeji: 1. řádek dny + zobrazení, 2. řádek můj program přes celou šířku */
  .toolbar{padding:2px 12px 0;gap:4px 8px}
  .pivot button{padding:9px 9px 11px;font-size:13.5px}
  .pivot button.on::after{left:9px;right:9px}
  .pivot .dn{display:none}
  .pivot .ds{display:inline}
  .tb-view{order:1;margin-left:auto;gap:4px}
  .tb-mine{order:2;width:100%;margin-left:0;justify-content:space-between}
  .seg button{padding:0 9px}
  .seg .lbl{display:none}
  .chips-row{padding:8px 12px 10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:-3px;padding:3px 24px 3px 3px;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  main{padding:0 8px}
  .modal-head{padding:14px 8px 6px 18px}
  .modal-body{padding:0 18px 18px}
  .row{grid-template-columns:4px minmax(0,1fr) auto;gap:10px}
  .row .r-time{grid-column:2;grid-row:1;font-size:12px}
  .row .r-bar{grid-column:1;grid-row:1 / span 2}
  .row .r-main{grid-column:2;grid-row:2}
  .row .r-side{grid-column:3;grid-row:1 / span 2}
  .conc-chip{display:none}
  body.compact main{padding:0 4px}
  body.compact .chips-row{padding:6px 8px 8px}
  .flyout{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:80dvh;border:1px solid var(--stroke);border-radius:12px;transform:translateY(calc(100% + 24px))}
  .scrim.show{opacity:1;pointer-events:auto}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="titlebox">
    <h1>Konference GIS Esri v ČR 2026</h1>
    <div class="meta-row"><span class="mi" id="dateMi">4.–5. listopadu 2026</span><span class="status-pill" id="statusPill"></span></div>
  </div>
  <div class="app-actions">
    <label class="search" id="searchBox"><span id="searchIc"></span>
      <input id="q" type="search" placeholder="Hledat přednášku, řečníka, organizaci…" autocomplete="off" aria-label="Hledat">
      <span class="tail"><kbd title="Klávesová zkratka">/</kbd><span id="qcount"></span><button type="button" id="qclear" title="Vymazat hledání (Esc)" aria-label="Vymazat hledání"></button></span>
    </label>
    <button type="button" class="hdr-btn" id="themeBtn"></button>
    <button type="button" class="hdr-btn" id="helpBtn" title="Nápověda – jak používat program konference" aria-label="Nápověda"></button>
  </div>
</header>

<div class="toolbar">
  <div class="pivot" role="tablist" id="dayTabs"></div>
  <div class="tb-mine">
    <label class="switch" title="Zobrazit jen položky označené hvězdičkou">
      <input type="checkbox" id="onlyMine"><span class="trk"></span>
      <span>Můj program</span><span class="badge" id="mineBadge"></span><span class="badge warn" id="confBadge" title="Počet konfliktů v mém programu"></span>
    </label>
    <div class="ibtns">
      <button type="button" class="ibtn" id="linkBtn" title="Kopírovat odkaz na můj program" aria-label="Kopírovat odkaz na můj program"></button>
      <button type="button" class="ibtn" id="exportBtn" title="Přidat můj program do kalendáře (.ics)" aria-label="Přidat můj program do kalendáře"></button>
      <button type="button" class="ibtn" id="clearBtn" title="Vymazat můj program" aria-label="Vymazat můj program" hidden></button>
    </div>
  </div>
  <div class="tb-view">
    <div class="seg" id="viewSeg"></div>
    <div class="seg" id="zoomSeg" title="Měřítko časové osy"></div>
    <button type="button" class="ibtn" id="fsBtn" title="Program na celou obrazovku" aria-label="Program na celou obrazovku"></button>
  </div>
</div>

<div class="chips-row">
  <div class="chips" id="chips"></div>
  <button type="button" class="ibtn" id="fsExit" title="Ukončit zobrazení na celou obrazovku" aria-label="Ukončit zobrazení na celou obrazovku"></button>
</div>

<main><div class="scroller" id="scroller"></div></main>

<div class="modal-scrim" id="helpScrim"></div>
<div class="modal" id="help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-head"><h2 id="helpTitle">Jak používat program konference</h2><button type="button" class="icon-btn" data-close-help title="Zavřít (Esc)" aria-label="Zavřít"></button></div>
  <div class="modal-body" id="helpBody"></div>
</div>

<aside class="flyout" id="flyout" aria-label="Detail položky"></aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {

const svg = (n, fill) => `<svg class="ic${fill ? ' fill' : ''}" viewBox="0 0 20 20" aria-hidden="true">${PATHS[n]}</svg>`;

/* ---------- Data ---------- */
const A = 'ARCDATA PRAHA, s.r.o.';
